        let handoffContext = this.getTrumpControlHandoffContext(pidx);
        let strongOffSuitControl = false;
        let partnerConfirmedVoidFeed = false;
        let postTrumpForbidden = false;
        let preferredHandoffTrump = false;
        if (handoffContext.active && handoffContext.canAttemptHandoff) {
            if (!leadTrump) {
                strongOffSuitControl = this.isStrongOffSuitControlCandidate(pidx, cards, publicState);
                partnerConfirmedVoidFeed = partnerModel.voidSuits.includes(first.suit) && partnerModel.mayHaveTrump;
                if (strongOffSuitControl) {
                    score += 18;
                    reasons.push('钓主后有确定大副牌，可继续控权 +18');
                } else if (partnerConfirmedVoidFeed) {
                    score += 14;
                    reasons.push('钓主后已确认对家断此门，可送牌交权 +14');
                } else {
                    score -= 48;
                    postTrumpForbidden = true;
                    reasons.push('钓主后对家未确认断此门：禁止猜牌乱出小副牌 -48');
                }
            } else if (cards.length === 1) {
                let handoffCard = this.chooseSmallTrumpHandoffCard(pidx);
                if (handoffCard && cards[0].id === handoffCard.id) {
                    score += 32;
                    preferredHandoffTrump = true;
                    reasons.push('钓主后无明确副牌控制：小主交牌权 +32');
                }
            }
        }

        // Phase 2.6：闲家残局若有对子，优先把最强对子留到最后一墩争取4倍扣底。
        let bottomReserve = this.getBottomCutReservePair(pidx, publicState);
        let isBottomReservePair = false;
        if (bottomReserve && this.sameCardSet(cards, bottomReserve.pair)) {
            isBottomReservePair = true;
            if (hand.length > cards.length) {
                score -= 90;
                reasons.push('闲家抠底保留对子：不是最后一手，保留到最后争取×4 -90');
            } else {
                score += 70;
                reasons.push('闲家最后一手对子：优先双扣底牌×4 +70');
            }
        }

        return {score, winChance, points, reasons, unsafePointLead, knownVoidLeadRisk, knownVoidLeadForbidden, handoffContext, strongOffSuitControl, partnerConfirmedVoidFeed, postTrumpForbidden, preferredHandoffTrump, pointlessTrumpFishing, trumpFishingPurpose, bottomReserve, isBottomReservePair};
    }

    chooseBestLeadCandidate(pidx, legacyChoice=[]) {
        let publicState = this.buildPublicState(pidx);
        let partnerModel = this.getPartnerModel(pidx);
        let candidates = this.generateLeadCandidates(pidx, legacyChoice);
        let scored = candidates.map(c => {
            let ev = this.scoreLeadCandidate(pidx, c.cards, publicState, partnerModel);
            return {...c, ...ev};
        }).sort((a,b)=>b.score-a.score);

        // Phase 2.2：裸送分牌门禁。
        let safePool = scored.filter(x => !x.unsafePointLead);
        let pool = safePool.length > 0 ? safePool : scored;

        // Phase 2.7：已知对手断门的副牌领出硬门禁。
        // 只要存在一手不会送给已断门对手毙的安全替代牌，就绝不主动再出该门。
        let nonSuicidePool = pool.filter(x => !x.knownVoidLeadForbidden);
        let avoidedKnownVoidLead = nonSuicidePool.length > 0 && nonSuicidePool.length < pool.length;
        if (nonSuicidePool.length > 0) pool = nonSuicidePool;

        // Phase 2.5：若还有其他可出牌，禁止“没有副牌兑现目标”的单张钓主。
        // 这避免机器人把主一直钓光，最后只剩几张小副牌任人控制。
        let purposefulPool = pool.filter(x => !x.pointlessTrumpFishing);
        if (purposefulPool.length > 0) pool = purposefulPool;

        // Phase 2.6：闲家抠底对子门禁。
        // 最后只剩保留对子时必须整对出；此前只要还有别的候选，就禁止提前打掉它。
        let reserveGate = this.getBottomCutReservePair(pidx, publicState);
        if (reserveGate && this.hands[pidx].length === reserveGate.pair.length) {
            let finalPairPool = pool.filter(x => this.sameCardSet(x.cards, reserveGate.pair));
            if (finalPairPool.length > 0) pool = finalPairPool;
        } else {
            let nonReservePool = pool.filter(x => !x.isBottomReservePair);
            if (nonReservePool.length > 0) pool = nonReservePool;
        }

        // Phase 2.3：钓主后的牌权交接门禁。
        // 机器人刚用主牌姐妹对/拖拉机控主后：
        // ① 确定的大副牌可以打；② 已公开确认对家断门，可送那门；③ 否则只能优先小主交权。
        // 绝不因为“估计/最近走势”去猜对家已经断门。
        let handoffContext = this.getTrumpControlHandoffContext(pidx);
        let handoffCard = handoffContext.active ? this.chooseSmallTrumpHandoffCard(pidx) : null;
        if (handoffContext.active && handoffContext.canAttemptHandoff) {
            let allowed = pool.filter(x => !x.postTrumpForbidden);
            let strongOffs = allowed.filter(x => x.strongOffSuitControl);
            let confirmedFeeds = allowed.filter(x => x.partnerConfirmedVoidFeed);
            let handoffs = allowed.filter(x => x.preferredHandoffTrump || (handoffCard && x.cards.length===1 && x.cards[0].id===handoffCard.id));

            if (strongOffs.length > 0) {
                // 有确定大副牌时，允许它与小主/确定送牌竞争，但弱副牌仍然禁用。
                pool = [...strongOffs, ...confirmedFeeds, ...handoffs].filter((x,i,a)=>a.indexOf(x)===i)
                    .sort((a,b)=>b.score-a.score);
            } else if (confirmedFeeds.length > 0) {
                // 已明确知道对家断某门，送该门和小主交权都合理。
                pool = [...confirmedFeeds, ...handoffs].filter((x,i,a)=>a.indexOf(x)===i)
                    .sort((a,b)=>b.score-a.score);
            } else if (handoffs.length > 0) {
                // 没有大副牌，也没有“对家明确断门”证据：强制继续小主钓主交权。
                pool = handoffs.sort((a,b)=>b.score-a.score);
            } else if (allowed.length > 0) {
                pool = allowed.sort((a,b)=>b.score-a.score);
            }
        }

        let chosen = pool[0] || safePool[0] || scored[0] || {cards: legacyChoice, score:0, reasons:['沿用原策略']};
        if (safePool.length > 0 && scored[0] && scored[0].unsafePointLead && chosen !== scored[0]) {
            chosen = {...chosen, reasons:[...(chosen.reasons||[]), '策略门禁：存在安全替代牌，禁止裸送未受保护的5/10/K']};
        }
        if (avoidedKnownVoidLead && chosen) {
            chosen = {...chosen, reasons:[...(chosen.reasons||[]), 'Phase 2.7门禁：已知对手断门且可能有主，禁止主动再送该门副牌']};
        }
        if (handoffContext.active && chosen) {
            chosen = {...chosen, reasons:[...(chosen.reasons||[]), ...handoffContext.reasons]};
            if (chosen.preferredHandoffTrump) {
                chosen.reasons.push('牌权交接：对家未确认断副牌，第一次用小主尝试交权');
            }
            if (!handoffContext.canAttemptHandoff) {
                chosen.reasons.push('牌权交接尝试已完成：若自己仍拿权，停止无目的连续钓主并重新评估副牌');
            }
        }
        return {chosen, top: scored.slice(0,5), publicState, partnerModel, handoffContext};
    }

    // Phase 2.8：判断“对家当前赢着的大分副牌是否需要我用主牌保驾”。
    // 不再只处理“对家首发K/10”的狭窄场景：只要当前赢家是对家、对家本墩打出了高价值副牌、
    // 我已断领出花色，且后面还有对手没出，就进入护航评估。
    // 核心牌理：此时“对家暂时赢着”并不等于安全；后手既可能用更大同门压，也可能断门后反毙。
    evaluatePartnerCoverNeed(pidx, leadCards, leadSuit, curWinner) {
        let result = {
            shouldCover:false, mandatory:false, higherUnknown:0, pendingOpps:[],
            partnerPoints:0, partnerCards:[], overruffRiskOpps:[], reasons:[]
        };
        if (!leadCards || leadCards.length !== 1 || this.firstPlayerOfRound === -1) return result;
        if (leadCards[0].isTrump) return result;

        let partner = (pidx + 2) % 4;
        if (curWinner !== partner) return result;

        let partnerCards = (this.played[partner] || []).filter(Boolean);
        if (partnerCards.length !== leadCards.length || partnerCards.length === 0) return result;
        // 本规则针对副牌分牌；如果对家是用主牌毙上来的，走普通“对家稳赢/投分”逻辑。
        if (!partnerCards.every(c => !c.isTrump && c.suit === leadSuit)) return result;

        let partnerPoints = partnerCards.reduce((sum,c)=>sum+c.score,0);
        let partnerHighScoreCard = [...partnerCards].filter(c=>c.score>0).sort((a,b)=>b.score-a.score || b.weight-a.weight)[0];
        if (!partnerHighScoreCard) return result;

        let pendingOpps = [];
        for (let seat=0; seat<4; seat++) {
            if (seat === pidx || seat % 2 === pidx % 2) continue;
            if (!this.played[seat] || this.played[seat].length === 0) pendingOpps.push(seat);
        }
        if (pendingOpps.length === 0) return result;

        let higherUnknown = this.countPossibleHigherSingles(pidx, partnerHighScoreCard);
        let overruffRiskOpps = pendingOpps.filter(o => !this.voidMap[o][4]); // 尚未确认断主，都可能反毙
        let allHarmless = pendingOpps.every(o => this.voidMap[o][4] && higherUnknown === 0);
        if (allHarmless) return result;

        result.higherUnknown = higherUnknown;
        result.pendingOpps = pendingOpps;
        result.partnerPoints = partnerPoints;
        result.partnerCards = partnerCards;
        result.overruffRiskOpps = overruffRiskOpps;

        // 10/K属于“大分牌”：后面仍有对手时默认强制护航。
        // 5分牌则结合比分、桌面总分、未知大牌/反毙风险动态决定。
        let tablePoints = 0;
        this.played.forEach(p => (p||[]).forEach(c => tablePoints += c.score));
        let mandatory = partnerPoints >= 10;
        let urgency = partnerPoints * 2.2 + tablePoints * 0.8 + Math.min(12, higherUnknown * 3)
                    + Math.min(10, overruffRiskOpps.length * 5)
                    + (this.score >= 60 ? 6 : 0);
        let shouldCover = mandatory || urgency >= 19;
        result.shouldCover = shouldCover;
        result.mandatory = mandatory;

        if (shouldCover) {
            result.reasons.push(`对家本墩有${partnerPoints}分副牌，后面还有${pendingOpps.length}名对手未出`);
            if (higherUnknown > 0) result.reasons.push(`仍有${higherUnknown}张更大同门未知`);
            if (overruffRiskOpps.length > 0) result.reasons.push(`${overruffRiskOpps.length}名后手尚未确认断主，存在反毙风险`);
            if (mandatory) result.reasons.push('10分以上对家分牌：进入强制保驾模式');
        }
        return result;
    }

    // Phase 2.8：对家高分牌护航时，不再机械使用“最便宜的小主”。
    // 目标是“够大且稳”：若后面没人可能反毙，仍用最小主；若有反毙风险，优先选择公开信息下
    // 更难被盖的主牌。若存在已成绝对顶张的主，选其中成本最低者；否则选手里最强的合理主。
    chooseCoverTrump(pidx, trumps, coverNeed=null) {
        if (!trumps || trumps.length === 0) return null;
        let hand = this.hands[pidx];
        let pairIds = new Set(this.getPairs(hand.filter(c=>c.isTrump)).flat().map(c=>c.id));
        let baseCost = c => {
            let v = 0;
            if (c.rankIdx === 14) v += 16000;
            else if (c.rankIdx === 13) v += 12000;
            else if (c.weight >= 700) v += 4500;
            else v += c.weight;
            if (c.score > 0) v += 1800 + c.score*100;
            if (pairIds.has(c.id)) v += 220;
            return v;
        };

        let candidates = [...trumps];
        if (!coverNeed || !coverNeed.shouldCover) {
            return candidates.sort((a,b)=>baseCost(a)-baseCost(b))[0];
        }

        let pendingMayTrump = (coverNeed.overruffRiskOpps || []).length > 0;
        if (!pendingMayTrump) {
            // 后手都已确认断主：任何主都足够，保持实力。
            return candidates.sort((a,b)=>baseCost(a)-baseCost(b))[0];
        }

        let enriched = candidates.map(c => ({
            c,
            higher: this.countPossibleHigherSingles(pidx, c),
            cost: baseCost(c)
        }));

        // 若手里有公开信息下已经“没有更大未知主”的牌，它才是真正的保险牌。
        let guaranteed = enriched.filter(x => x.higher === 0);
        if (guaranteed.length > 0) {
            guaranteed.sort((a,b)=>a.cost-b.cost || a.c.weight-b.c.weight);
            return guaranteed[0].c;
        }

        // 没有绝对保险牌时：大分牌优先把“被更大主盖住的可能性”压到最低。
        // 先比外面可能更大的主牌数，再在同等安全级别里保护王/级牌/对子。
        enriched.sort((a,b) => {
            if (a.higher !== b.higher) return a.higher - b.higher;
            if (a.c.weight !== b.c.weight) return b.c.weight - a.c.weight;
            return a.cost - b.cost;
        });

        // 对10分以上的强制护航，直接取最稳候选；5分弹性护航则避免无必要动王。
        if (coverNeed.mandatory) return enriched[0].c;
        let nonJoker = enriched.filter(x => x.c.rankIdx < 13);
        return (nonJoker[0] || enriched[0]).c;
    }

    evaluateRuffDecision(pidx, ruffCards, tablePoints, isLastPos, leadSuit, curWinner) {
        if (!ruffCards || ruffCards.length === 0) return {shouldRuff:false, value:-999, reasons:['无可用主牌']};
        let reasons = [];
        let value = 0;
        let isDealerTeam = (pidx % 2 === this.dealer % 2);
        let opponentWinning = curWinner === -1 || (curWinner % 2 !== pidx % 2);
        let minW = Math.min(...ruffCards.map(c=>c.weight));
        let usesJoker = ruffCards.some(c=>c.rankIdx>=13);
        let usesLevel = ruffCards.some(c=>c.weight>=700 && c.rankIdx<13);

        // 抢当前分数。
        value += tablePoints * 1.35;
        if (tablePoints > 0) reasons.push(`抢桌面${tablePoints}分 +${(tablePoints*1.35).toFixed(1)}`);

        // 最后一位能确定拿墩，价值更高；前面还有人则保守些。
        if (isLastPos) { value += 10; reasons.push('末位确定性 +10'); }
        else { value -= 2; reasons.push('后手仍有风险 -2'); }

        // 拿回牌权的战略价值：手里有A/对子/长套时，哪怕桌面分不高也值得小主毙。
        let hand = this.hands[pidx];
        let followUpAssets = 0;
        let aces = hand.filter(c=>!c.isTrump && c.rankIdx===12).length;
        let pairs = this.getPairs(hand.filter(c=>!c.isTrump)).length;
        let shortSuits = 0;
        for (let s=0;s<4;s++) {
            let cnt = hand.filter(c=>!c.isTrump && c.suit===s).length;
            if (cnt>0 && cnt<=2) shortSuits++;
        }
        followUpAssets = Math.min(12, aces*3 + pairs*1.5 + shortSuits*1.5);
        value += followUpAssets;
        if (followUpAssets >= 4) reasons.push(`拿权后有后续牌型 +${followUpAssets.toFixed(1)}`);

        // 比分临界：闲家冲80，或庄家阻止闲家上80。
        if (this.score >= 60) {
            let urgency = isDealerTeam ? 10 : 8;
            value += urgency;
            reasons.push(`${isDealerTeam?'防闲家到80':'冲击80'} +${urgency}`);
        }

        // 主牌机会成本：普通小主便宜，级牌/王昂贵。
        let cost = 0;
        if (usesJoker) cost += tablePoints >= 20 ? 7 : 15;
        if (usesLevel) cost += 8;
        if (!usesJoker && !usesLevel && minW < 700) cost += 3;
        // 拆主对子额外昂贵。
        let pairIds = new Set(this.getPairs(hand.filter(c=>c.isTrump)).flat().map(c=>c.id));
        let breaksPair = ruffCards.some(c=>pairIds.has(c.id)) && ruffCards.length===1;
        if (breaksPair) cost += 8;
        value -= cost;
        if (cost > 0) reasons.push(`主牌机会成本 -${cost}`);

        if (!opponentWinning) {
            value -= 14;
            reasons.push('对家当前已赢，毙牌必要性低 -14');
        }

        // 动态阈值：不再硬编码“不到20分绝不小主毙”。
        let threshold = isLastPos ? 7 : 11;
        return {shouldRuff: value >= threshold, value, threshold, reasons};
    }


    // Phase 2.4：敌方当前赢副牌、我已断门时的“默认必毙”规则。
    // 这是牌权规则，不再受“桌面必须达到多少分”这种旧阈值限制。
    // 只使用当前公开桌面 + 自己手牌；不会读取其他玩家暗牌。
    chooseMandatoryEnemyRuff(pidx, first, leadSuit, curWinner, maxW) {
        let result = { shouldRuff:false, cards:[], reason:'' };
        if (!first || first.length === 0 || first[0].isTrump) return result;
        if (curWinner === -1 || curWinner % 2 === pidx % 2) return result; // 当前是我方赢，不抢

        let hand = this.hands[pidx];
        let trumps = hand.filter(c => c.isTrump);
        if (trumps.length === 0) return result;

        // 成本只用于“该用哪张主”，不再用于决定“毙不毙”。
        let trumpPairIds = new Set(this.getPairs(trumps).flat().map(c=>c.id));
        let cardCost = c => {
            // Phase 2.6：先保护“实力等级”，再考虑对子。
            // 普通小主无论是否成对，都不应因为一个对子惩罚而跳到级牌/王。
            let v = c.weight;
            if (c.rankIdx === 14) v += 16000;      // 大王最后用
            else if (c.rankIdx === 13) v += 12000; // 小王
            else if (c.weight >= 700) v += 5000;  // 级牌是核心控制力
            if (c.score > 0) v += 1800 + c.score*100;
            if (trumpPairIds.has(c.id)) v += 220; // 尽量不拆主对子，但优先级低于保护大主
            return v;
        };
        let comboCost = cards => cards.reduce((sum,c)=>sum+cardCost(c),0);

        let leadPairsCount = this.getPairs(first).length;
        let leadIsTractor = this.isPureTractor(first);

        // 1) 单张副牌：任何能盖住当前最大牌的主牌都可毙，选最低成本。
        if (first.length === 1 && leadPairsCount === 0) {
            let candidates = trumps.filter(c => (c.weight + 10000) > maxW)
                                   .sort((a,b)=>cardCost(a)-cardCost(b));
            if (candidates.length > 0) {
                let chosen;
                if (this.allOtherPlayersConfirmedInLeadSuit(pidx, leadSuit)) {
                    // 三家本墩都已实际跟出该副牌：没人能再反毙，最小主100%够用。
                    chosen = this.chooseMinimumSufficientTrump(pidx, candidates, maxW) || candidates[0];
                    result.reason = `本墩已确认其余三家都有${SUITS[leadSuit]}，只需最小够用主牌${chosen.getLabel()}，保留大主实力`;
                } else {
                    chosen = candidates[0];
                    result.reason = `敌方当前赢${SUITS[leadSuit]}副牌，我已断门：用最低成本主牌${chosen.getLabel()}必毙抢权`;
                }
                result.shouldRuff = true;
                result.cards = [chosen];
            }
            return result;
        }

        // 2) 纯拖拉机：有同长度主拖拉机且能盖住时，必须用主拖拉机毙。
        if (leadIsTractor) {
            let windows = this.getTractorWindows(trumps, leadPairsCount);
            let valid = windows.map(w=>w.flat()).filter(cards => {
                let w = this.calcBatchWeight(cards, leadPairsCount) + 10000;
                return w > maxW;
            }).sort((a,b)=>comboCost(a)-comboCost(b));
            if (valid.length > 0) {
                result.shouldRuff = true;
                result.cards = valid[0];
                result.reason = `敌方拖拉机当前赢、我已断门：用最低成本主拖拉机毙牌抢权`;
            }
            return result;
        }

        // 3) 纯对子/多对子：有足够主对子并能盖住时，优先整对毙，不拆结构。
        if (leadPairsCount > 0 && first.length === leadPairsCount * 2) {
            let pairs = this.getPairs(trumps).sort((a,b)=>comboCost(a)-comboCost(b));
            if (pairs.length >= leadPairsCount) {
                // 穷举小规模组合，找到成本最低且能赢的组合（最多常见几对，开销很小）
                let best = null;
                const dfs = (start, picked) => {
                    if (picked.length === leadPairsCount) {
                        let cards = picked.flat();
                        let w = this.calcBatchWeight(cards, leadPairsCount) + 10000;
                        if (w > maxW) {
                            let cost = comboCost(cards);
                            if (!best || cost < best.cost) best = {cards, cost};
                        }
                        return;
                    }
                    for (let i=start; i<pairs.length; i++) dfs(i+1, [...picked, pairs[i]]);
                };
                dfs(0, []);
                if (best) {
                    result.shouldRuff = true;
                    result.cards = best.cards;
                    result.reason = `敌方对子当前赢、我已断门：用最低成本主对子毙牌抢权`;
                }
            }
            return result;
        }

        return result; // 复杂甩牌继续交给原合法性/甩牌逻辑处理
    }

    logAiDecision(pidx, kind, finalCards, detail={}) {
        this.recorder.safe(()=>this.recorder.decision(pidx,finalCards,kind,detail));
        let top = detail.top || [];
        let entry = {
            time: Date.now(),
            player: NAMES[pidx],
            kind,
            cards: this.describeCards(finalCards),
            score: detail.score,
            reasons: detail.reasons || [],
            top: top.map(x=>({cards:this.describeCards(x.cards), score:x.score, tag:x.tag})),
            publicSummary: detail.publicSummary || ''
        };
        this.aiDecisionLog.unshift(entry);
        this.aiDecisionLog = this.aiDecisionLog.slice(0, this.aiSettings.maxDecisionLog);
        this.renderAiLog();
        console.log('[Phase2 AI]', entry);
    }

    renderAiLog() {} // Diagnostics stay in exported reviews; there is no on-screen AI panel.

    // 估算对手某门副牌还有多少张（用于判断是否安全出牌）
    estimateOppHasSuit(pidx, suit) {
        let op1 = (pidx+1)%4, op2 = (pidx+3)%4;
        return !this.voidMap[op1][suit] || !this.voidMap[op2][suit];
    }

    // Phase 2.5：从历史对子跟牌中推断“某家在某门已经没有对子”。
    // 规则依据：领出n个对子时，有对子必须尽量跟足；若某家当时只跟出k<n个对子，
    // 说明它当时手里全部对子都已经被迫打出。牌只会减少，因此以后不可能重新长出对子。
    hasConfirmedNoPairRemaining(seat, groupKey) {
        if (this.inferenceState && this.inferenceState.confirmedNoPair && this.inferenceState.confirmedNoPair[seat] && this.inferenceState.confirmedNoPair[seat][groupKey]) return true;
        for (let i=this.trickHistory.length-1; i>=0; i--) {
            let t = this.trickHistory[i];
            if (!t || t.leadPairCount < 1 || t.leadSuit !== groupKey || !t.plays || !t.plays[seat]) continue;
            let pp = t.plays[seat] || [];
            let relevant = groupKey === 4
                ? pp.filter(c => c.isTrump)
                : pp.filter(c => !c.isTrump && c.suit === groupKey);
            let followedPairs = this.getPairs(relevant).length;
            if (followedPairs < t.leadPairCount) return true;
        }
        return false;
    }

    // 当前我方对子是否已因“上一轮逼出/确认对手无对子”而进入可放心投分状态。
    evaluateAllyPairControl(pidx, leadSuit, curWinner) {
        let result = {secure:false, reasons:[], pendingOpps:[]};
        if (curWinner === -1 || curWinner % 2 !== pidx % 2) return result;
        let lead = this.played[this.firstPlayerOfRound] || [];
        let leadPairCount = this.getPairs(lead).length;
        if (leadPairCount < 1 || lead[0].isTrump) return result;

        let winningCards = this.played[curWinner] || [];
        let winningPairs = this.getPairs(winningCards);
        if (winningPairs.length < leadPairCount) return result;
        let topWinningPair = [...winningPairs].sort((a,b)=>b[0].weight-a[0].weight)[0];
        let noHigherPairType = topWinningPair ? this.countPossibleHigherPairTypes(pidx, topWinningPair) === 0 : false;

        let pendingOpps = [];
        for (let seat=0; seat<4; seat++) {
            if (seat === pidx || seat % 2 === pidx % 2) continue;
            if (!this.played[seat] || this.played[seat].length === 0) pendingOpps.push(seat);
        }
        result.pendingOpps = pendingOpps;
        if (pendingOpps.length === 0) {
            result.secure = true;
            result.reasons.push('后手已无对手，对家对子确定收分');
            return result;
        }

        let harmless = pendingOpps.every(o => {
            if (this.voidMap[o][leadSuit]) {
                // 对手已断该门：只有主对子才可能毙。若其也断主，或历史已确认无主对子，则无威胁。
                return this.voidMap[o][4] || this.hasConfirmedNoPairRemaining(o, 4);
            }
            // 对手仍有该门：如果上一轮对子已确认其没有剩余对子，就只能跟散牌；
            // 或当前我方对子本身已无任何更大对子类型在未知区。
            return this.hasConfirmedNoPairRemaining(o, leadSuit) || noHigherPairType;
        });

        if (harmless) {
            result.secure = true;
            let noPairSeats = pendingOpps.filter(o => this.hasConfirmedNoPairRemaining(o, leadSuit));
            if (noPairSeats.length) result.reasons.push(`上一轮对子已确认后手对手无${SUITS[leadSuit]}对子`);
            if (noHigherPairType) result.reasons.push('公开牌面已无更大同门对子类型');
            result.reasons.push('当前对子控制成立：可以把分牌投给对家');
        }
        return result;
    }

    // ★修复3：统一判断"对家当前赢面是否稳固"——稳才投分，不稳垫废牌。
    // 只使用公开信息（voidMap、已出的A）推断，不偷看对手手牌。
    allyWinSecure(pidx, allyWinning, maxW, isLastPos, leadTrump, leadSuit) {
        if (!allyWinning) return false;
        if (isLastPos) return true;
        // Phase 3：不再把700/800级牌硬编码成“稳赢”。
        // 统一依据公开未知牌、后手断门/断主和牌型结构判断是否仍存在反超通道。
        let sec = this.phase3CurrentWinnerSecurity(pidx);
        return !!sec.secure;
    }

    // ★修复9：挑单牌时优先挑"不属于任何对子"的散牌，避免拆对。
    // 对子只能被更大的同门对子/主牌对子压住，是战略资产，能不拆就不拆。
    // 保持传入数组的原有排序；若全是对子成员则原样返回（实在没散牌只能拆）。
    preferNonPaired(cards) {
        let pairIds = new Set(this.getPairs(cards).flat().map(c => c.id));
        let np = cards.filter(c => !pairIds.has(c.id));
        return np.length > 0 ? np : cards;
    }

    // 选择最佳的对子来跟牌（智能选牌）
    chooseBestPairToFollow(pairs, maxW, allyWinning, tablePoints, isLastPos) {
        if (pairs.length === 0) return null;
        // 对家赢牌：跟分数对子
        if (allyWinning) {
            let pointPairs = pairs.filter(p => p[0].score > 0 || p[1].score > 0).sort((a,b)=>b[0].score-a[0].score);
            if (pointPairs.length > 0) return pointPairs[0];
            return pairs.sort((a,b) => a[0].weight - b[0].weight)[0]; // 跟最小的
        }
        // 对手赢牌：尝试用最小的能赢的对子来压
        let beatingPairs = pairs.filter(p => p[0].weight > maxW).sort((a,b) => a[0].weight - b[0].weight);
        if (beatingPairs.length > 0) return beatingPairs[0]; // 用最小能赢的对子
        // 不能赢：跟最小无分对子
        let noscorePairs = pairs.filter(p => p[0].score === 0).sort((a,b) => a[0].weight - b[0].weight);
        if (noscorePairs.length > 0) return noscorePairs[0];
        return pairs.sort((a,b) => a[0].weight - b[0].weight)[0];
    }

    // ============================================================
    // AI甩牌合法性验证器
    // 规则：首发甩出多张同门牌时，每一个"牌型单元"（单张/对子/拖拉机）
    // 都必须是该门中最大的——即场上其他三家手中该门不存在能大过该单元的牌。
    // 如果验证失败，返回降级后的合法出牌（通常缩减为单张最大牌）。
    // ============================================================
    aiValidateThrow(pidx, cards) {
        if (cards.length <= 1) return cards; // 单张永远合法

        // Phase 1 关键修复：普通对子、完整拖拉机本身就是合法首发，
        // 不能因为别人暗牌里恰好有更大的对子/拖拉机就被误判成“甩牌失败”。
        let basicPairs = this.getPairs(cards);
        let isSimplePair = cards.length === 2 && basicPairs.length === 1;
        let isSimpleTractor = this.isPureTractor(cards);
        if (isSimplePair || isSimpleTractor) return cards;

        let suitKey = cards[0].isTrump ? 'trump' : cards[0].suit;

        // 所有牌必须同门
        if (!cards.every(c => (c.isTrump ? 'trump' : c.suit) === suitKey)) {
            // 不同门，只出最大那张
            return [cards.sort((a,b) => b.weight - a.weight)[0]];
        }

        // 分解出牌组合的结构
        let pairs    = this.getPairs(cards);
        let tractors = this.getAllTractors(cards);
        let pairsInTractors = tractors.flat();
        let standalonePairs = pairs.filter(p =>
            !pairsInTractors.some(tp => tp[0].id === p[0].id)
        );
        let singles = cards.filter(c =>
            !pairs.some(p => p[0].id === c.id || p[1].id === c.id)
        );

        // 对其他三家逐一检查
        let failedSingles   = false;
        let failedPairs     = false;
        let failedTractors  = false;

        for (let offset = 1; offset <= 3; offset++) {
            let oppIdx  = (pidx + offset) % 4;
            let oppHand = this.hands[oppIdx];
            let oppSame = oppHand.filter(c =>
                cards[0].isTrump ? c.isTrump : (!c.isTrump && c.suit === cards[0].suit)
            );
            if (oppSame.length === 0) continue;

            let oppPairs    = this.getPairs(oppSame);
            let oppTractors = this.getAllTractors(oppSame);

            // 检查单张：我的最小单张 vs 对手该门最大牌
            if (singles.length > 0) {
                let minMySingleW  = Math.min(...singles.map(c => c.weight));
                let maxOppAnyW    = Math.max(...oppSame.map(c => c.weight));
                if (maxOppAnyW > minMySingleW) failedSingles = true;
            }

            // 检查独立对子：我的最小独立对子 vs 对手该门最大对子
            if (standalonePairs.length > 0 && oppPairs.length > 0) {
                let minMyPairW  = Math.min(...standalonePairs.map(p => p[0].weight));
                let maxOppPairW = Math.max(...oppPairs.map(p => p[0].weight));
                if (maxOppPairW > minMyPairW) failedPairs = true;
            }

            // 检查拖拉机：我的最小拖拉机 vs 对手同长度拖拉机
            for (let t of tractors) {
                let tLen         = t.length;
                let minMyTractW  = Math.min(...t.map(p => p[0].weight));
                let matchingOpp  = oppTractors.filter(ot => ot.length >= tLen);
                for (let ot of matchingOpp) {
                    for (let j = 0; j <= ot.length - tLen; j++) {
                        let sub         = ot.slice(j, j + tLen);
                        let minOppTractW = Math.min(...sub.map(p => p[0].weight));
                        if (minOppTractW > minMyTractW) failedTractors = true;
                    }
                }
            }
        }

        // 全部通过 → 合法甩牌
        if (!failedSingles && !failedPairs && !failedTractors) return cards;

        // ---- 甩牌验证失败：裁判执行处罚后降级处理 ----
        // 裁判层可以读取真实暗牌判定甩牌是否成立；AI策略层不能提前知道答案。
        // 电脑甩错与玩家一样罚10分，避免“机器人试错却不付代价”的隐性作弊。
        this.applyPenalty(pidx, "电脑甩错牌罚分", "罚十分！");
        // 降级选择只依据自己刚才准备甩出的牌，不读取对手暗牌来寻找所谓“安全牌”。
        let ownTractors = this.getAllTractors(cards);
        if (ownTractors.length > 0) {
            // 优先保留一组完整拖拉机；普通拖拉机作为单独首发永远合法。
            ownTractors.sort((a,b) => b.length - a.length || b[0][0].weight - a[0][0].weight);
            return ownTractors[0].flat();
        }

        let ownPairs = this.getPairs(cards).sort((a,b) => b[0].weight - a[0].weight);
        if (ownPairs.length > 0) {
            // 其次整对出，绝不因甩牌失败再去偷看别人暗牌决定“安全对子”。
            return [ownPairs[0][0], ownPairs[0][1]];
        }

        // 最后退化为自己组合中最大的单张。
        return [[...cards].sort((a,b) => b.weight - a.weight)[0]];
    }

    async aiTurn() {
        if (this.phase !== 'PLAYING' || this.turn === -1) return;
        try {
            let pidx = this.turn, hand = this.hands[pidx], first = this.played[this.firstPlayerOfRound];
            let toPlay = [];
            let phase2TacticalNotes = [];

            // Phase 3 Core：统一决策入口。成功返回后立即执行，不再继续穿过旧优先级/多重门禁。
            if (this.aiSettings && this.aiSettings.phase3Core) {
                let p3 = this.choosePhase3Move(pidx);
                if (p3 && p3.cards && p3.cards.length) {
                    this.logAiDecision(pidx, p3.kind || 'Phase3 Core', p3.cards, {
                        score:p3.score,
                        reasons:p3.reasons||[],
                        top:p3.top||[],
                        publicSummary:'V5：按逐人逐门出牌、断门、对子/连对缺失及余牌上下界推理；无保护分牌禁出，完整姊妹对优先。'
                    });
                    await new Promise(r => setTimeout(r, 650));
                    this.executePlay(pidx, p3.cards);
                    return;
                }
            }
            let nonTrump = hand.filter(c => !c.isTrump);
            let trumps = hand.filter(c => c.isTrump);

            if (!first || first.length === 0) {
                // ========== 首发出牌逻辑（重构版） ==========
                let op1VoidTrump = this.voidMap[(pidx+1)%4][4];
                let op2VoidTrump = this.voidMap[(pidx+3)%4][4];
                let oppsVoidTrump = op1VoidTrump && op2VoidTrump;
                let isDealer = (pidx === this.dealer);
                let isDealerTeam = (pidx % 2 === this.dealer % 2); // 我是庄家方
                let isFirstTrick = hand.length >= 24; // 首轮（每人25张，第一轮出牌时≥24）
                let isMidGame = hand.length <= 18 && hand.length > 6;
                let isEndgame = hand.length <= 6;

                // 【优先级1】甩牌：只要手中有必赢的A（或对A），立即打出，不能拖
                // 这解决了"留着A没机会出"的核心问题
                if (toPlay.length === 0) {
                    let bestThrow = [];
                    for (let s = 0; s < 4; s++) {
                        let op1Void = this.voidMap[(pidx+1)%4][s];
                        let op2Void = this.voidMap[(pidx+3)%4][s];
                        if (op1Void || op2Void) continue; // 敌人有绝门风险，跳过
                        let suitCards = nonTrump.filter(c => c.suit === s).sort((a,b) => b.rankIdx - a.rankIdx);
                        if (suitCards.length === 0) continue;
                        let aCards = suitCards.filter(c => c.rankIdx === 12); // A
                        let kCards = suitCards.filter(c => c.rankIdx === 11); // K
                        let qCards = suitCards.filter(c => c.rankIdx === 10); // Q
                        let otherAcesPlayed = this.playedAces[s] || 0;

                        // 检查K是否安全（其他人该门没有A）
                        let kSafe = (otherAcesPlayed >= 2 - aCards.length); // 所有A均已出或在自己手里
                        // 检查Q是否安全
                        let playedKCount = 0; // 简单估算：K安全且自己有2张K则Q也可能安全
                        let qSafe = kSafe && kCards.length === 2;

                        let currentThrow = [];
                        // ★修复3：出A时，把同门所有"必赢的对子"也一起甩出
                        // 逻辑：找出该门花色中，对手没有比它更大的对子 → 这些对子是安全的
                        let suitPairs = this.getPairs(suitCards.filter(c => !aCards.includes(c)));
                        let guaranteedPairs = suitPairs.filter(p => {
                            return this.isGuaranteedBiggestPair(pidx, p);
                        }).sort((a,b) => b[0].rankIdx - a[0].rankIdx); // 从大到小
                        
                        if (aCards.length === 2) {
                            currentThrow.push(...aCards);
                            if (kCards.length > 0 && kSafe) currentThrow.push(...kCards);
                            if (kCards.length === 2 && qCards.length > 0 && qSafe) currentThrow.push(...qCards);
                            // 额外：把必赢的10对、J对等也一起出
                            for (let gp of guaranteedPairs) {
                                if (!currentThrow.some(c => c.id === gp[0].id)) {
                                    currentThrow.push(gp[0], gp[1]);
                                }
                            }
                        } else if (aCards.length === 1) {
                            if (kCards.length === 2 && kSafe) {
                                currentThrow.push(...aCards, ...kCards);
                                if (qCards.length === 2 && qSafe) currentThrow.push(...qCards);
                                // 额外：把必赢的小对子也一起出
                                for (let gp of guaranteedPairs) {
                                    if (!currentThrow.some(c => c.id === gp[0].id)) {
                                        currentThrow.push(gp[0], gp[1]);
                                    }
                                }
                            } else if (kCards.length === 1 && otherAcesPlayed >= 1 && kSafe) {
                                // 另一张A已出，AK必赢
                                currentThrow.push(...aCards, ...kCards);
                            } else {
                                // 单A也要出，不能留着等死
                                currentThrow.push(...aCards);
                            }
                        }
                        if (currentThrow.length > bestThrow.length) {
                            bestThrow = currentThrow;
                        }
                    }
                    if (bestThrow.length > 0) toPlay = bestThrow;
                    // 找到单A的情况也要输出
                    if (toPlay.length === 0) {
                        for (let s = 0; s < 4; s++) {
                            let op1Void = this.voidMap[(pidx+1)%4][s];
                            let op2Void = this.voidMap[(pidx+3)%4][s];
                            let suitAces = nonTrump.filter(c => c.suit === s && c.rankIdx === 12);
                            if (suitAces.length > 0 && !op1Void && !op2Void) {
                                toPlay = suitAces.length >= 2 ? suitAces.slice(0,2) : [suitAces[0]];
                                break;
                            }
                        }
                    }
                }

                // 【优先级2】副牌大对子/拖拉机——趁对方未断门先抢分
                // 规则：对子（除A外）都是大牌，必须尽早打出，错过时机对方断门就废了
                if (toPlay.length === 0 && nonTrump.length > 0) {
                    // 找出"高价值对子"：K对及以上，或有分数的对子（含10对、K对）
                    let allPairs = this.getPairs(nonTrump);
                    // 先找拖拉机（最强出牌）
                    let offSuitTractors = this.getAllTractors(nonTrump);
                    // 筛选：对手至少有一方没有断门（出了才有意义）
                    let valuableTractors = offSuitTractors.filter(t => {
                        let s = t[0][0].suit;
                        return !this.voidMap[(pidx+1)%4][s] && !this.voidMap[(pidx+3)%4][s];
                    });
                    let valuablePairs = allPairs.filter(p => {
                        let s = p[0].suit;
                        // 对手没有全部断门
                        let oppsVoid = this.voidMap[(pidx+1)%4][s] && this.voidMap[(pidx+3)%4][s];
                        if (oppsVoid) return false;
                        // ★修复2a：K对以上、含分数的对子
                        // 额外：A已出尽时，K对变成最大，也应该出
                        let kPairIsTop = p[0].rankIdx === 11 && this.isAceExhausted(s);
                        // 或者：这个对子是该门最大的对子（对手没有比它更大的对子）
                        let isTopPair = this.isGuaranteedBiggestPair(pidx, p);
                        return p[0].rankIdx >= 11 || p[0].score > 0 || kPairIsTop || isTopPair;
                    }).sort((a,b) => b[0].weight - a[0].weight); // 大对子优先

                    if (valuableTractors.length > 0) {
                        toPlay = valuableTractors[0].flat();
                    } else if (valuablePairs.length > 0) {
                        // ★ 修复4：出分牌对子前，检查是否安全
                        let bestPair = valuablePairs[0];
                        let pairSuit = bestPair[0].suit;
                        let pairHasScore = bestPair[0].score > 0;
                        if (pairHasScore) {
                            // 有分对子：只在两个对手都无法截胡时才出
                            // 条件：两个对手都断这门花色，或两个对手都断主牌
                            let op1VoidSuit2 = this.voidMap[(pidx+1)%4][pairSuit];
                            let op2VoidSuit2 = this.voidMap[(pidx+3)%4][pairSuit];
                            let op1VoidTrump2 = this.voidMap[(pidx+1)%4][4];
                            let op2VoidTrump2 = this.voidMap[(pidx+3)%4][4];
                            let scorePairSafe = (op1VoidSuit2 && op2VoidSuit2) ||
                                               (op1VoidTrump2 && op2VoidTrump2) ||
                                               bestPair[0].rankIdx >= 12; // A对必赢
                            if (scorePairSafe) toPlay = bestPair;
                            // 不安全则不出，继续找下一优先级
                        } else {
                            toPlay = bestPair; // 无分对子安全出
                        }
                    }
                }

                // 【优先级2.5】Phase 2.6：残局牌型管理。
                // 庄家方仍可主动兑现对子/拖拉机；闲家则优先保留最强对子到最后一手争取双扣×4。
                if (toPlay.length === 0 && hand.length <= 12) {
                    let isChallengerTeam26 = (pidx % 2 !== this.dealer % 2);
                    let reserve26 = isChallengerTeam26 ? this.getBottomCutReservePair(pidx) : null;
                    let lateTractors = this.getAllTractors(hand);
                    if (lateTractors.length > 0 && !isChallengerTeam26) {
                        lateTractors.sort((a,b) => b[0][0].weight - a[0][0].weight);
                        toPlay = lateTractors[0].flat();
                    } else {
                        let latePairs = this.getPairs(hand);
                        if (latePairs.length > 0 && (!reserve26 || hand.length === 2)) {
                            let safeLatePairs = latePairs.filter(p => {
                                if (p[0].isTrump) return true;
                                let s = p[0].suit;
                                let op1CanRuff = this.voidMap[(pidx+1)%4][s] && !this.voidMap[(pidx+1)%4][4];
                                let op2CanRuff = this.voidMap[(pidx+3)%4][s] && !this.voidMap[(pidx+3)%4][4];
                                return !op1CanRuff && !op2CanRuff;
                            });
                            let latePool = safeLatePairs.length > 0 ? safeLatePairs : latePairs;
                            toPlay = latePool.sort((a,b) => b[0].weight - a[0].weight)[0];
                        }
                        // 闲家尚有其他牌时故意不在这里动保留对子，让后续候选评分选择散牌先走。
                    }
                }

                // 【优先级3】庄家方首轮：清副牌建立长套（若优先级2未触发）
                // ★修复4a：优先出无分对子；无对子时出最长门最小无分单张探路，
                // 不再裸甩最大单张（那往往是K/10分牌，直接喂给对手的A）
                if (toPlay.length === 0 && isDealerTeam && isFirstTrick && nonTrump.length > 0) {
                    let allPairs = this.getPairs(nonTrump);
                    let noScorePairs3 = allPairs.filter(p => p[0].score === 0).sort((a,b)=>b[0].weight-a[0].weight);
                    if (noScorePairs3.length > 0) {
                        toPlay = noScorePairs3[0];
                    } else if (allPairs.length > 0) {
                        toPlay = allPairs.sort((a,b)=>b[0].weight-a[0].weight)[0];
                    } else {
                        let suitCounts3 = {0:0,1:0,2:0,3:0};
                        nonTrump.forEach(c => suitCounts3[c.suit]++);
                        let probe = nonTrump.filter(c => c.score === 0).sort((a,b) => {
                            if (suitCounts3[a.suit] !== suitCounts3[b.suit]) return suitCounts3[b.suit] - suitCounts3[a.suit];
                            return a.weight - b.weight;
                        });
                        toPlay = probe.length > 0 ? [probe[0]] : [[...nonTrump].sort((a,b)=>a.weight-b.weight)[0]];
                    }
                }

                // 【优先级4】投喂对家已断门（对家用主牌毙，我出这门给对家逃分）
                // ★修复5：必须同时满足 (1)对家可能还有主牌可毙 (2)没有"断门且可能有主"的对手能盖毙
                if (toPlay.length === 0) {
                    let partnerMayHaveTrump = !this.voidMap[(pidx+2)%4][4];
                    for(let s=0; s<4; s++) {
                        let partnerVoid = this.voidMap[(pidx+2)%4][s];
                        let op1Void = this.voidMap[(pidx+1)%4][s];
                        let op2Void = this.voidMap[(pidx+3)%4][s];
                        let oppCanOverRuff = (op1Void && !this.voidMap[(pidx+1)%4][4]) ||
                                             (op2Void && !this.voidMap[(pidx+3)%4][4]);
                        if (partnerVoid && partnerMayHaveTrump && !oppCanOverRuff) {
                            let mySuitCards = nonTrump.filter(c => c.suit === s).sort((a,b)=>a.weight-b.weight);
                            if (mySuitCards.length > 0) {
                                // ★修复9：喂牌优先挑散牌，不拆对子
                                let feedPool = this.preferNonPaired(mySuitCards);
                                let scoreCards = feedPool.filter(c => c.score > 0);
                                toPlay = scoreCards.length > 0 ? [scoreCards[0]] : [feedPool[0]];
                                break;
                            }
                        }
                    }
                }

                // 【优先级5】清短门（断门为后续毙牌做准备，只出单张）
                if (toPlay.length === 0 && !oppsVoidTrump && nonTrump.length > 0) {
                    let suitCounts = {0:0,1:0,2:0,3:0};
                    nonTrump.forEach(c => suitCounts[c.suit]++);
                    let shortSuit = -1, minCount = 99;
                    for(let s=0; s<4; s++) {
                        if (suitCounts[s] > 0 && suitCounts[s] <= 2 && suitCounts[s] < minCount) {
                            let suitScoreCards = nonTrump.filter(c => c.suit === s && c.score > 0);
                            if (suitScoreCards.length === 0) { minCount = suitCounts[s]; shortSuit = s; }
                        }
                    }
                    if (shortSuit !== -1) {
                        let shortCards = nonTrump.filter(c => c.suit === shortSuit).sort((a,b)=>a.weight-b.weight);
                        // ★修复9：短门恰好是一个对子→整对打出（既清门又不拆对）；
                        // 否则优先出不属于对子的散牌
                        let shortPairs = this.getPairs(shortCards);
                        if (shortCards.length === 2 && shortPairs.length === 1) {
                            toPlay = shortPairs[0];
                        } else {
                            toPlay = [this.preferNonPaired(shortCards)[0]];
                        }
                    }
                }

                // 【优先级6】出副牌拖拉机（非高价值，但安全）
                if (toPlay.length === 0) {
                    let offSuitTractors = this.getAllTractors(nonTrump);
                    if (offSuitTractors.length > 0) {
                        let safeTractor = offSuitTractors.find(t => !this.voidMap[(pidx+1)%4][t[0][0].suit] && !this.voidMap[(pidx+3)%4][t[0][0].suit]);
                        if (safeTractor) toPlay = safeTractor.flat();
                        else if (oppsVoidTrump) toPlay = offSuitTractors[0].flat();
                    }
                }

                // 【优先级7】钓主（出主牌掏对手王牌）
                if (toPlay.length === 0 && !oppsVoidTrump && trumps.length > 0) {
                    let weakTrumps = trumps.length <= 5;
                    let hasSmallOffSuit = nonTrump.some(c => c.weight < 700 && c.score === 0);
                    let shouldHold = isDealerTeam && weakTrumps && hasSmallOffSuit && !isEndgame && !isMidGame;
                    if (!shouldHold) {
                        let noScoreTrumps = trumps.filter(c => c.score === 0 && c.rankIdx < 13).sort((a,b)=>a.weight-b.weight);
                        // ★修复1：钓主要出"有实力"的主牌，至少要比K大（weight>111）
                        // 否则对手只需一张小主牌就能截走出牌权，得不偿失
                        // K的主牌weight = 100+11 = 111（主色K），非主色K更小
                        // 比K大的无分主牌：主A(112+), 副色级牌(700+), 主色级牌(800), 小王(900), 大王(1000)
                        // ★修复9：钓主挑单张时不拆主牌对子（主对子是残局利器）
                        let fishPool = this.preferNonPaired(noScoreTrumps);
                        let strongNoScoreTrumps = fishPool.filter(c => c.weight > 111);
                        if (strongNoScoreTrumps.length > 0) {
                            // 出最小的"强主牌"（省牌，但有威慑力）
                            toPlay = [strongNoScoreTrumps[0]];
                        } else if (fishPool.length > 0) {
                            // 没有比K大的无分主牌，降级用普通无分主牌
                            // 但仍然出最大的（最大化威慑）
                            toPlay = [fishPool[fishPool.length - 1]];
                        } else {
                            // 实在没有无分主牌，出最小主牌（也尽量挑散牌）
                            toPlay = [this.preferNonPaired([...trumps].sort((a,b)=>a.weight-b.weight))[0]];
                        }
                    }
                }

                // 【优先级8】出一般对子（无论大小，总比单张强）
                // ★修复4b：非必赢对子出小的探路、优先无分对子；
                // 原逻辑专挑最大对子出，QQ/JJ直接喂给对手的KK/AA
                if (toPlay.length === 0) {
                    let anyPairs = this.getPairs(nonTrump).filter(p => {
                        let s = p[0].suit;
                        return (!this.voidMap[(pidx+1)%4][s] && !this.voidMap[(pidx+3)%4][s]) || oppsVoidTrump;
                    });
                    if (anyPairs.length > 0) {
                        let noScoreAny = anyPairs.filter(p => p[0].score === 0);
                        let pickFrom = noScoreAny.length > 0 ? noScoreAny : anyPairs;
                        toPlay = pickFrom.sort((a,b)=>a[0].weight-b[0].weight)[0];
                    }
                }

                // 【优先级8】清废牌（最低优先级兜底）
                if (toPlay.length === 0) {
                    let suitCounts = {0:0, 1:0, 2:0, 3:0};
                    nonTrump.forEach(c => suitCounts[c.suit]++);
                    // 优先清短门无分废牌
                    let trashNonTrump = nonTrump.filter(c => c.score === 0).sort((a,b) => {
                        if (suitCounts[a.suit] !== suitCounts[b.suit]) return suitCounts[a.suit] - suitCounts[b.suit];
                        return a.weight - b.weight;
                    });
                    if (trashNonTrump.length > 0) {
                        // ★修复9：清废牌优先挑散牌，不拆对子
                        toPlay = [this.preferNonPaired(trashNonTrump)[0]];
                    } else if (nonTrump.length > 0) {
                        // ★ 修复3：有无分废牌先出废牌，没有才考虑出分牌
                        // 在出分牌之前，检查是否安全：
                        // - 伙伴（玩家，seat=0，AI是pidx=1/2/3）能赢这圈吗？
                        // - 如果不能确定伙伴能赢，不要出副牌分牌，改出最小主牌
                        let partnerSeat3 = (pidx + 2) % 4;
                        let isPartnerPlayer = (partnerSeat3 === 0); // 玩家是seat 0
                        let scoreNonTrump = nonTrump.filter(c => c.score > 0).sort((a,b)=>a.score-a.weight*0.001-b.score+b.weight*0.001);
                        let safeToPlayScore = false;
                        if (scoreNonTrump.length > 0) {
                            let cardSuit3 = scoreNonTrump[0].suit;
                            let op1VoidSuit = this.voidMap[(pidx+1)%4][cardSuit3];
                            let op2VoidSuit = this.voidMap[(pidx+3)%4][cardSuit3];
                            let partnerHasSuit = !this.voidMap[partnerSeat3][cardSuit3];
                            let op1VoidTrump3 = this.voidMap[(pidx+1)%4][4];
                            let op2VoidTrump3 = this.voidMap[(pidx+3)%4][4];
                            // ★修复F：更精确的安全出分牌判断
                            let bothOppVoidSuit  = op1VoidSuit && op2VoidSuit;
                            let bothOppVoidTrump = op1VoidTrump3 && op2VoidTrump3;
                            let playerIsDealer   = (0 % 2 === this.dealer % 2); // 玩家(seat0)是否庄家方
                            let iAmDealerTeam    = (pidx % 2 === this.dealer % 2);
                            // 同队（玩家是庄家方且我也是），更积极出分跑分
                            let dealerTeamActive = playerIsDealer && iAmDealerTeam;
                            safeToPlayScore =
                                bothOppVoidSuit ||                             // 对手都断门
                                (partnerHasSuit && bothOppVoidTrump) ||        // 伙伴有且对手无主
                                (dealerTeamActive && (op1VoidSuit || op2VoidSuit)); // 庄家队跑分
                        }
                        if (safeToPlayScore && scoreNonTrump.length > 0) {
                            toPlay = [scoreNonTrump[0]];
                        } else {
                            // 不安全，改出最小主牌（比出分牌损失小）
                            let safeTrumpFirst = trumps.filter(c => c.score === 0 && c.rankIdx < 13).sort((a,b)=>a.weight-b.weight);
                            if (safeTrumpFirst.length > 0) {
                                // ★修复9：不拆主对子
                                toPlay = [this.preferNonPaired(safeTrumpFirst)[0]];
                            } else {
                                // 实在没有，才出分牌
                                toPlay = [[...nonTrump].sort((a,b)=>a.weight-b.weight)[0]];
                            }
                        }
                    } else if (trumps.length > 0) {
                        let safeT = trumps.filter(c => c.rankIdx < 13).sort((a,b)=>a.weight-b.weight);
                        // ★修复9：不拆主对子
                        if (safeT.length > 0) toPlay = [this.preferNonPaired(safeT)[0]];
                        else toPlay = [this.preferNonPaired([...trumps].sort((a,b)=>a.weight-b.weight))[0]];
                    }
                    else toPlay = [hand.sort((a,b)=>a.weight-b.weight)[0]];
                }
                
            } else {
                // ========== 跟牌/垫牌逻辑 ==========
                let leadTrump = first[0].isTrump, leadSuit = first[0].suit;
                let reqSuitIdx = leadTrump ? 4 : leadSuit;
                let mySame = hand.filter(c => leadTrump ? c.isTrump : (c.suit === leadSuit && !c.isTrump));
                
                let curWinner = this.getWinner();
                let allyWinning = curWinner !== -1 && (curWinner % 2 === pidx % 2);
                let cardsPlayedCount = this.played.filter(p => p.length > 0).length;
                let isLastPos = cardsPlayedCount === 3;
                let isPartnerOfLeader = (pidx % 2 === this.firstPlayerOfRound % 2); // 我是领出者的对家
                let isDealerTeam = (pidx % 2 === this.dealer % 2);

                // 区分"我是最后一个出牌"和"对手还没出"
                let opponentAlreadyPlayed = false;
                for(let offset=1; offset<=cardsPlayedCount; offset++) {
                    let prevIdx = (this.firstPlayerOfRound + offset) % 4;
                    if (this.played[prevIdx].length > 0 && prevIdx % 2 !== pidx % 2) {
                        opponentAlreadyPlayed = true; break;
                    }
                }
                let tablePoints = 0;
                this.played.forEach(p => p.forEach(c => tablePoints += c.score));

                // ★修复1：当前最大权重计算与 getWinner 完全同一套判定——
                // 用 calcBatchWeight 取牌组真实权重（不再错误地用 p[0].weight），
                // 并检查牌型结构（跟不上对子/拖拉机结构的出牌不可能赢，不计入 maxW）
                let leadPairsCount = this.getPairs(first).length;
                let leadIsTractor = leadPairsCount >= 2 && this.isTractor(this.getPairs(first));
                let maxW = -1;
                let winnerIsTrump = false;
                for(let i=0; i<4; i++){
                    if(this.played[i].length>0){
                        let p = this.played[i];
                        let isPureTrump = p.every(c => c.isTrump);
                        let isPureLeadSuit = p.every(c => !c.isTrump && c.suit === leadSuit);
                        let valid = false;
                        if (leadTrump) valid = isPureTrump;
                        else valid = isPureLeadSuit || isPureTrump;
                        if (valid && leadPairsCount > 0) {
                            let pPairs = this.getPairs(p);
                            if (pPairs.length < leadPairsCount) valid = false;
                            else if (leadIsTractor && !this.isTractor(pPairs)) valid = false;
                        }
                        if(valid) {
                            let w = this.calcBatchWeight(p, leadPairsCount) + (isPureTrump && !leadTrump ? 10000 : 0);
                            if(w > maxW) { maxW = w; winnerIsTrump = isPureTrump; }
                        }
                    }
                }

                // ================================================================
                // ★修复2：原【钓主时伙伴接手】特殊分支已删除。
                // 该分支只比较对家领出的牌(leadW)、完全无视中间对手已打出的更大牌，
                // 是"白送主K/级牌给对手"的根源。现统一走下方通用跟牌逻辑，
                // "庄家方接手牌权"的意图由 worthBeating/takeover 条件正确实现。
                // ================================================================

                // ===== 通用跟牌逻辑 =====
                if (toPlay.length === 0) {
                if (mySame.length > 0) {
                    // ★修复3：投分与否统一交给 allyWinSecure 判断（对家"稳赢"才投分）。
                    // ★修复8：废除原来写反了的 !opponentAlreadyPlayed 条件——
                    // 对手还没出牌恰恰是最危险的时候，绝不能作为投分的理由。
                    let secure = this.allyWinSecure(pidx, allyWinning, maxW, isLastPos, leadTrump, leadSuit);
                    if (secure && !leadTrump && leadPairsCount > 0 && allyWinning) {
                        let pc = this.evaluateAllyPairControl(pidx, leadSuit, curWinner);
                        if (pc.secure) phase2TacticalNotes.push(`对子控制：${pc.reasons.join('；')}，优先投分给对家`);
                    }

                    // 第一步：强制先跟对子（规则要求），按局面智能选牌
                    if (leadPairsCount > 0) {
                        let myPairs = this.getPairs(mySame);
                        let required = Math.min(myPairs.length, leadPairsCount);
                        if (required > 0) {
                            let chosenPairs;
                            let beatingPairs = myPairs.filter(p => p[0].weight > maxW)
                                                      .sort((a,b) => a[0].weight - b[0].weight);
                            let worthBeating = tablePoints > 0 || isLastPos || (leadTrump && isDealerTeam);
                            if (!allyWinning && beatingPairs.length >= required && worthBeating) {
                                // 对手赢着且值得抢：用最小能赢的对子组合压回来
                                chosenPairs = beatingPairs.slice(0, required);
                            } else if (secure) {
                                // 对家稳赢：跟分数对子投分
                                chosenPairs = [...myPairs]
                                    .sort((a,b) => (b[0].score - a[0].score) || (a[0].weight - b[0].weight))
                                    .slice(0, required);
                            } else {
                                // 压不住或局势不稳：跟最小的无分对子，保护分牌
                                chosenPairs = [...myPairs]
                                    .sort((a,b) => (a[0].score - b[0].score) || (a[0].weight - b[0].weight))
                                    .slice(0, required);
                            }
                            chosenPairs.forEach(p => toPlay.push(p[0], p[1]));
                        }
                    }

                    let needed = first.length - toPlay.length;
                    let remainingMySame = mySame.filter(c => !toPlay.includes(c));
                    let matchedStructure = (toPlay.length / 2) >= leadPairsCount;

                    if (remainingMySame.length >= needed) {
                        if (needed > 0) {
                            // 庄家方在主牌圈"接手"：对家领出小主钓鱼、局面未稳时，
                            // 用主A以上的无分实力牌接管牌权（绝不再拿主K这种10分牌去送）
                            let takeover = leadTrump && isDealerTeam && allyWinning && !secure;
                            if (secure) {
                                // 对家稳赢：投分（分牌从大到小，废牌从小到大补足）
                                // ★修复9：补废牌时散牌优先，不拆对子
                                let pid9a = new Set(this.getPairs(remainingMySame).flat().map(c => c.id));
                                let points = remainingMySame.filter(c => c.score > 0)
                                    .sort((a,b) => (b.score - a.score) || (pid9a.has(a.id) - pid9a.has(b.id)));
                                let trash  = remainingMySame.filter(c => c.score === 0)
                                    .sort((a,b) => (pid9a.has(a.id) - pid9a.has(b.id)) || (a.weight - b.weight));
                                toPlay.push(...[...points, ...trash].slice(0, needed));
                            } else if (matchedStructure && leadPairsCount === 0 && (!allyWinning || takeover)) {
                                // 纯单张圈：看是否值得用最小能赢的牌压回/接手
                                // ★修复9：能赢的牌里优先用散牌压，保住手里的对子
                                let pid9b = new Set(this.getPairs(remainingMySame).flat().map(c => c.id));
                                let beaters = remainingMySame.filter(c => c.weight > maxW)
                                                             .sort((a,b) => {
                                                                 // Phase 2.6：先取“刚好能压过”的最小实力，再尽量不拆对子。
                                                                 if (a.weight !== b.weight) return a.weight - b.weight;
                                                                 return (pid9b.has(a.id) - pid9b.has(b.id));
                                                             });
                                if (takeover) {
                                    // 接手只用主A(112)及以上且无分的牌，否则宁可垫小牌
                                    beaters = beaters.filter(c => c.weight >= 112 && c.score === 0);
                                }
                                let worthBeating2 = tablePoints > 0 || isLastPos || (leadTrump && isDealerTeam);
                                if (beaters.length >= needed && worthBeating2) {
                                    toPlay.push(...beaters.slice(0, needed));
                                } else {
                                    toPlay.push(...this.getWorstCards(remainingMySame, needed));
                                }
                            } else {
                                // 结构跟不上（不可能赢）或不值得抢：垫最废的牌，保护分牌
                                toPlay.push(...this.getWorstCards(remainingMySame, needed));
                            }
                        }
                    } else {
                        toPlay.push(...remainingMySame);
                        let stillNeeded = first.length - toPlay.length;
                        // ★修复3b：垫牌是否投分改用 secure 判断，而非"此刻对家在赢"的即时快照
                        let fillers = this.getBestPadding(hand.filter(c => !toPlay.includes(c)), stillNeeded, secure, tablePoints);
                        toPlay.push(...fillers);
                    }
                } else {
                    // ===== 断门（无同门牌）：毙牌 or 垫牌 =====
                    
                    let canRuff = false;
                    let ruffCards = [];
                    let mandatoryEnemyRuff = false;
                    let mandatoryPartnerCover = false;
                    
                    if (!leadTrump) {
                        let allyIsWinning = (curWinner !== -1 && curWinner % 2 === pidx % 2);

                        // Phase 2.4：先处理最基本的牌权原则。
                        // 敌方当前赢副牌 + 我已断门 + 有合法能赢的主牌 => 默认必须毙，
                        // 不再因为桌面0分/5分、不是末位、或“主牌机会成本”而主动放弃牌权。
                        let forcedRuff = this.chooseMandatoryEnemyRuff(pidx, first, leadSuit, curWinner, maxW);
                        if (forcedRuff.shouldRuff) {
                            canRuff = true;
                            mandatoryEnemyRuff = true;
                            ruffCards = forcedRuff.cards;
                            phase2TacticalNotes.push(`强制毙牌：${forcedRuff.reason}`);
                        }

                        // Phase 2.2：对家“分牌保驾”优先于普通 allyWinning 判断。
                        // 以前这里因为 allyIsWinning=true，会先认为“对家已经赢了”而不毙，
                        // 导致对家领K、外面还有A时机器人明明断门有主却垫废牌。
                        let coverNeed = this.evaluatePartnerCoverNeed(pidx, first, leadSuit, curWinner);
                        if (!canRuff && coverNeed.shouldCover && trumps.length >= first.length) {
                            let coverTrump = this.chooseCoverTrump(pidx, trumps, coverNeed);
                            if (coverTrump) {
                                canRuff = true;
                                mandatoryPartnerCover = coverNeed.mandatory || coverNeed.shouldCover;
                                ruffCards = [coverTrump];
                                phase2TacticalNotes.push(`对家高分保驾：${coverNeed.reasons.join('；')} → 用${coverTrump.getLabel()}封口`);
                            }
                        }
                        
                        if (!canRuff && !allyIsWinning) {
                            if (leadPairsCount > 0) {
                                let trumpPairs = this.getPairs(trumps);
                                if (trumpPairs.length >= leadPairsCount) {
                                    trumpPairs.sort((a,b) => a[0].weight - b[0].weight);
                                    let ruffW = trumpPairs[leadPairsCount - 1][0].weight + 10000;
                                    if (ruffW > maxW) {
                                        canRuff = true;
                                        for(let i=0; i<leadPairsCount; i++) ruffCards.push(trumpPairs[i][0], trumpPairs[i][1]);
                                        let needed = first.length - ruffCards.length;
                                        if (needed > 0) {
                                            let remainingTrumps = trumps.filter(c => !ruffCards.includes(c)).sort((a,b)=>a.weight-b.weight);
                                            if (remainingTrumps.length >= needed) ruffCards.push(...remainingTrumps.slice(0, needed));
                                            else canRuff = false;
                                        }
                                    }
                                }
                            } else {
                                // ★修复B：截对手副牌要用比A大的主牌（weight>=700：级牌/小王/大王）
                                // 普通小主牌（weight<700）代价太高，不值得拿来截副牌
                                // ★修复9：毙牌挑主牌时散牌优先，不拆主对子
                                let pidRuff9 = new Set(this.getPairs(trumps).flat().map(c => c.id));
                                let allRuffBeaters = trumps.filter(c => (c.weight + 10000) > maxW)
                                                          .sort((a,b) => {
                                                              let tier = c => c.rankIdx===14 ? 3 : (c.rankIdx===13 ? 2 : (c.weight>=700 ? 1 : 0));
                                                              if (tier(a) !== tier(b)) return tier(a)-tier(b);
                                                              let ap = pidRuff9.has(a.id) ? 1 : 0, bp = pidRuff9.has(b.id) ? 1 : 0;
                                                              if (ap !== bp) return ap-bp;
                                                              return a.weight-b.weight;
                                                          });
                                // Phase 2：动态毙牌价值。
                                // 不再使用“桌面不到20分就绝不用小主”的死规则；同时考虑牌权、比分、后续A/对子、主牌机会成本。
                                let useRuffers = null;
                                let ruffEval = null;
                                if (allRuffBeaters.length >= first.length) {
                                    let candidateRuff = allRuffBeaters.slice(0, first.length);
                                    ruffEval = this.evaluateRuffDecision(pidx, candidateRuff, tablePoints, isLastPos, leadSuit, curWinner);
                                    phase2TacticalNotes.push(`毙牌评估 ${ruffEval.value.toFixed(1)}/${ruffEval.threshold}：${ruffEval.shouldRuff ? '值得毙' : '保留主牌'}`);
                                    if (ruffEval.shouldRuff) useRuffers = candidateRuff;
                                }
                                
                                if (useRuffers) {
                                    canRuff = true;
                                    let minRuff = useRuffers;
                                    if (tablePoints > 0 || isLastPos) {
                                        ruffCards = minRuff;
                                    } else {
                                        if (!opponentAlreadyPlayed) {
                                            ruffCards = minRuff;
                                        } else {
                                            canRuff = false;
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // ★修复3c/修复8：断门垫牌/毙牌前，对家赢面统一用 allyWinSecure 判断，
                    // 废除"对手还没出牌反而敢投分"(!opponentAlreadyPlayed)的反向条件
                    let allyWinningSafe = this.allyWinSecure(pidx, allyWinning, maxW, isLastPos, leadTrump, leadSuit);

                    if (allyWinningSafe && !mandatoryPartnerCover) {
                        toPlay = this.getBestPadding(hand, first.length, true, tablePoints);
                    } else {
                        if (canRuff) {
                            let usesJoker = ruffCards.some(c => c.rankIdx >= 13);
                            if (mandatoryPartnerCover) {
                                // Phase 2.8：对家大分牌保驾属于“封口”动作。
                                // 即使旧的 allyWinSecure 暂时认为对家领先，也不能再被垫牌逻辑覆盖。
                                toPlay = ruffCards;
                            } else if (mandatoryEnemyRuff) {
                                // Phase 2.4：只要这是“敌方当前赢、我断门”的强制毙牌，
                                // 即使桌面0分、甚至只剩王能毙，也不再被旧的节省主牌逻辑改回垫牌。
                                toPlay = ruffCards;
                            } else if (tablePoints > 0) {
                                toPlay = ruffCards;
                            } else if (!usesJoker) {
                                toPlay = ruffCards;
                            } else {
                                toPlay = this.getBestPadding(hand, first.length, false, tablePoints);
                            }
                        } else {
                            // ★修复2：截不了但有分牌在桌，且对手还有人未出牌
                            // 不能直接垫废牌！第4个人可能出更大的牌截走分牌
                            // 条件：桌面有分、不是最后位、对手还有未出牌的人、我有主牌
                            let remainingOpponentCount = 0;
                            for (let offset = 1; offset <= 3; offset++) {
                                let checkSeat = (this.firstPlayerOfRound + offset) % 4;
                                if (this.played[checkSeat].length === 0 && checkSeat !== pidx) {
                                    if (checkSeat % 2 !== pidx % 2) remainingOpponentCount++;
                                }
                            }
                            let shouldProtectWithTrump = (
                                tablePoints > 0 &&          // 桌面有分
                                !isLastPos &&               // 我不是最后出
                                remainingOpponentCount > 0 && // 对手还有人没出
                                !leadTrump &&               // 领出是副牌（不是主牌）
                                trumps.length > 0           // 我有主牌
                            );
                            if (shouldProtectWithTrump) {
                                // 出最小的能赢的主牌（weight+10000 > maxW）
                                let protectTrumps = trumps.filter(c => (c.weight + 10000) > maxW)
                                                         .sort((a,b) => a.weight - b.weight);
                                if (protectTrumps.length > 0) {
                                    // Phase 2：护分也走动态价值，不再按“10分才舍得用王”这种单阈值。
                                    // 优先选择不拆对子、成本最低的能赢主牌。
                                    let safeProtect = protectTrumps.filter(c => c.rankIdx < 13);
                                    let poolProtect = safeProtect.length > 0 ? safeProtect : protectTrumps;
                                    let chosenProtect = [this.preferNonPaired(poolProtect)[0]];
                                    let protectEval = this.evaluateRuffDecision(pidx, chosenProtect, tablePoints, isLastPos, leadSuit, curWinner);
                                    phase2TacticalNotes.push(`护分毙牌 ${protectEval.value.toFixed(1)}/${protectEval.threshold}：${protectEval.shouldRuff ? '出主' : '不出主'}`);
                                    if (protectEval.shouldRuff) toPlay = chosenProtect;
                                    else toPlay = this.getBestPadding(hand, first.length, false, tablePoints);
                                } else {
                                    toPlay = this.getBestPadding(hand, first.length, false, tablePoints);
                                }
                            } else {
                                // ★修复C：截不了时，不出分牌，帮玩家保分
                                // 优先出无分小主牌（消耗但不损分），而不是垫副牌分牌
                                let noScoreSmallTrumps = trumps.filter(c => c.score===0 && c.weight<700)
                                                               .sort((a,b)=>a.weight-b.weight);
                                let noScoreNonTrump = nonTrump.filter(c => c.score===0)
                                                              .sort((a,b)=>a.weight-b.weight);
                                if (noScoreSmallTrumps.length >= first.length) {
                                    // 有无分小主牌，出它（不出分牌，不乱垫副牌）
                                    // ★修复9：单张场景挑散牌，不拆主对子
                                    toPlay = first.length === 1
                                        ? [this.preferNonPaired(noScoreSmallTrumps)[0]]
                                        : noScoreSmallTrumps.slice(0,first.length);
                                } else if (noScoreNonTrump.length >= first.length) {
                                    // 有无分副牌，垫废副牌
                                    toPlay = this.getBestPadding(hand, first.length, false, 0);
                                } else {
                                    // 实在没有，走正常逻辑
                                    toPlay = this.getBestPadding(hand, first.length, false, tablePoints);
                                }
                            }
                        }
                    }
                }
                } // end if(toPlay.length === 0)
            }

            // Phase 2：首发不再只服从固定优先级。
            // 原策略作为一个候选，与单张/对子/拖拉机候选一起评分，再选择综合价值最高者。
            let phase2LeadDecision = null;
            if ((!first || first.length === 0) && this.aiSettings.leadCandidateScoring) {
                phase2LeadDecision = this.chooseBestLeadCandidate(pidx, toPlay);
                if (phase2LeadDecision && phase2LeadDecision.chosen && phase2LeadDecision.chosen.cards.length > 0) {
                    toPlay = phase2LeadDecision.chosen.cards;
                }
            }

            if (!toPlay || toPlay.length === 0 || toPlay.includes(undefined))
                toPlay = hand.slice(0, first ? first.length : 1);

            // ★ 首发时，严格验证甩牌合法性，不合法则自动降级
            if (!first || first.length === 0) {
                toPlay = this.aiValidateThrow(pidx, toPlay);
            } else {
                // ★ 跟牌时：若 isValidPlay 检测到违规（如漏出对子），自动修正
                if (!this.isValidPlay(pidx, toPlay)) {
                    // 重新构建合规出牌：强制跟对子
                    let fst = this.played[this.firstPlayerOfRound];
                    let leadTrump2 = fst[0].isTrump;
                    let leadSuit2 = fst[0].suit;
                    let mySame2 = hand.filter(c => leadTrump2 ? c.isTrump : (c.suit === leadSuit2 && !c.isTrump));
                    let leadPairsCount2 = this.getPairs(fst).length;
                    let leadIsTractor2 = this.isPureTractor(fst);
                    let fixedPlay = [];
                    if (mySame2.length > 0) {
                        // 如果领出是拖拉机且我有同长度拖拉机，优先整组跟出。
                        if (leadIsTractor2) {
                            let windows2 = this.getTractorWindows(mySame2, leadPairsCount2);
                            if (windows2.length > 0) {
                                windows2.sort((a,b) => a[a.length-1][0].weight - b[b.length-1][0].weight);
                                fixedPlay.push(...windows2[0].flat());
                            }
                        }
                        // 没有完整拖拉机可跟时，再按规则尽量跟足对子。
                        if (fixedPlay.length === 0 && leadPairsCount2 > 0) {
                            let myPairs2 = this.getPairs(mySame2);
                            let required2 = Math.min(myPairs2.length, leadPairsCount2);
                            myPairs2.sort((a,b) => a[0].weight - b[0].weight)
                                    .slice(0, required2)
                                    .forEach(p => fixedPlay.push(p[0], p[1]));
                        }
                        // 补足数量
                        let needed2 = fst.length - fixedPlay.length;
                        let rest2 = mySame2.filter(c => !fixedPlay.includes(c))
                                           .sort((a,b) => a.weight - b.weight);
                        fixedPlay.push(...rest2.slice(0, needed2));
                        // 如果还不够（同门牌不足），补垫牌
                        if (fixedPlay.length < fst.length) {
                            let stillNeeded = fst.length - fixedPlay.length;
                            let padCards = hand.filter(c => !fixedPlay.includes(c))
                                              .sort((a,b) => a.weight - b.weight);
                            fixedPlay.push(...padCards.slice(0, stillNeeded));
                        }
                    } else {
                        fixedPlay = hand.sort((a,b)=>a.weight-b.weight).slice(0, fst.length);
                    }
                    toPlay = fixedPlay;
                }
            }

            // Phase 2：记录可解释决策。只展示游戏AI的公开信息与评分，不包含任何暗牌。
            if (phase2LeadDecision) {
                let c = phase2LeadDecision.chosen;
                let ps = phase2LeadDecision.publicState;
                this.logAiDecision(pidx, '首发候选评分', toPlay, {
                    score: c.score,
                    reasons: c.reasons,
                    top: phase2LeadDecision.top,
                    publicSummary: `已公开${ps.playedCount}张｜未知主牌约${ps.unknownTrump}张｜对家断门：${phase2LeadDecision.partnerModel.voidSuits.map(s=>SUITS[s]).join('、') || '无'}｜对家近轮跟过：${phase2LeadDecision.partnerModel.recentFollowedSuits.map(s=>SUITS[s]).join('、') || '无'}${phase2LeadDecision.handoffContext && phase2LeadDecision.handoffContext.active ? '｜钓主后牌权交接模式：开启' : ''}`
                });
            } else {
                let tablePointsLog = 0;
                this.played.forEach(p=>p.forEach(c=>tablePointsLog+=c.score));
                this.logAiDecision(pidx, '跟牌/垫牌', toPlay, {
                    reasons: [
                        ...phase2TacticalNotes,
                        `当前桌面${tablePointsLog}分`,
                        `对家${(this.getWinner()!==-1 && this.getWinner()%2===pidx%2)?'当前领先':'未领先'}`,
                        `公开记牌：已出${this.playHistory.length}张`
                    ]
                });
            }

            await new Promise(r => setTimeout(r, 750));
            this.executePlay(pidx, toPlay);
        } catch(e) {
            console.log("AI Fallback triggered", e);
            this.recorder.safe(()=>this.recorder.engineError(this.turn,e));
            // Phase 3：异常兜底也必须合法，禁止直接 slice 手牌造成错花色/漏对子/漏拖拉机。
            let seat=this.turn;
            let legal=this.phase3LowestCostLegalMove(seat);
            if (legal && legal.length) this.executePlay(seat, legal);
            else console.error('Phase3 legal fallback failed: no legal move generated');
        }
    }

    getWorstCards(cards, neededCount) {
        // ★修复E：严格保护分牌，特别是主牌分牌
        // 顺序：无分副牌 → 副牌分牌(5→10→K) → 无分A → 无分小主牌 → 主牌分牌 → 大小王
        // ★修复9：每一档内先出散牌、后动对子成员，尽量不拆对子
        let pairIds9 = new Set(this.getPairs(cards).flat().map(c => c.id));
        let tier9 = arr => [...arr.filter(c => !pairIds9.has(c.id)), ...arr.filter(c => pairIds9.has(c.id))];
        let trashNonTrump = tier9(cards.filter(c => !c.isTrump && c.score===0 && c.rankIdx<12)
                                 .sort((a,b)=>a.weight-b.weight));
        let pointNonTrump = tier9(cards.filter(c => !c.isTrump && c.score>0 && c.rankIdx<12)
                                 .sort((a,b)=>a.score-b.score)); // 5分先于10/K
        let aces          = tier9(cards.filter(c => !c.isTrump && c.rankIdx===12)
                                 .sort((a,b)=>a.weight-b.weight));
        let trashTrump    = tier9(cards.filter(c => c.isTrump && c.score===0 && c.rankIdx<13)
                                 .sort((a,b)=>a.weight-b.weight));
        let pointTrump    = tier9(cards.filter(c => c.isTrump && c.score>0 && c.rankIdx<13)
                                 .sort((a,b)=>a.score-b.score));
        let jokers        = tier9(cards.filter(c => c.rankIdx>=13)
                                 .sort((a,b)=>a.weight-b.weight));
        
        let res = [];
        for(let c of trashNonTrump) { if(res.length < neededCount) res.push(c); }
        for(let c of pointNonTrump) { if(res.length < neededCount) res.push(c); }
        for(let c of aces)          { if(res.length < neededCount) res.push(c); }
        for(let c of trashTrump)    { if(res.length < neededCount) res.push(c); }
        for(let c of pointTrump)    { if(res.length < neededCount) res.push(c); }
        for(let c of jokers)        { if(res.length < neededCount) res.push(c); }
        if (res.length < neededCount) {
            let remain = cards.filter(c => !res.includes(c));
            for(let c of remain) { if(res.length < neededCount) res.push(c); }
        }
        return res;
    }

    getBestPoints(cards, neededCount) {
        let points = cards.filter(c => c.score > 0 && c.rankIdx < 12).sort((a,b)=>b.score-a.score);
        let trash = cards.filter(c => c.score === 0 && c.rankIdx < 12).sort((a,b)=>a.weight-b.weight);
        let aces = cards.filter(c => !c.isTrump && c.rankIdx === 12).sort((a,b)=>a.weight-b.weight);
        let trumps = cards.filter(c => c.isTrump && c.rankIdx < 13 && c.score === 0).sort((a,b)=>a.weight-b.weight);
        let jokers = cards.filter(c => c.rankIdx >= 13).sort((a,b)=>a.weight-b.weight);
        
        let res = [];
        for(let c of points) { if(res.length < neededCount) res.push(c); }
        for(let c of trash) { if(res.length < neededCount) res.push(c); }
        for(let c of aces) { if(res.length < neededCount) res.push(c); }
        for(let c of trumps) { if(res.length < neededCount) res.push(c); }
        for(let c of jokers) { if(res.length < neededCount) res.push(c); }
        
        if (res.length < neededCount) {
             let remain = cards.filter(c => !res.includes(c));
             for(let c of remain) { if (res.length < neededCount) res.push(c); }
        }
        return res;
    }

    getBestPadding(hand, neededCount, allyWinning, tablePoints=0) {
        let pairs = this.getPairs(hand).flat();
        let singles = hand.filter(c => !pairs.includes(c));
        
        let suitCounts = {0:0, 1:0, 2:0, 3:0};
