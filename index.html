            if (pp.length > 0 && pp.every(c => !c.isTrump && c.suit === t.leadSuit)) {
                if (!recentFollowedSuits.includes(t.leadSuit)) recentFollowedSuits.push(t.leadSuit);
            }
        }

        return {
            partner,
            voidSuits,
            mayHaveTrump,
            wantsTrumpControl,
            isControlling,
            partnerLedTrump,
            partnerWins,
            partnerPointWins,
            recentFollowedSuits,
            lastLeadSuit: lastLead ? lastLead.leadSuit : null,
            lastLeadTrump: !!(lastLead && lastLead.leadTrump)
        };
    }

    // Phase 2.3：钓主后“牌权交接模式”。
    // 若AI刚刚用主牌姐妹对/拖拉机钓主并连续拿到牌权，说明主牌战术尚未结束。
    // 这时如果自己没有确定的大副牌，不应随便猜对家是否断某门，而应继续用低成本小主
    // 把出牌权尽量交给对家。只有 voidMap 已经公开确认对家断门，才允许主动送该门副牌。
    getTrumpControlHandoffContext(pidx) {
        let partnerModel = this.getPartnerModel(pidx);
        let result = {
            active:false,
            partner:partnerModel.partner,
            partnerMayHaveTrump:partnerModel.mayHaveTrump,
            anchorFound:false,
            chainLength:0,
            handoffAttempts:0,
            canAttemptHandoff:false,
            reasons:[]
        };
        if (!partnerModel.mayHaveTrump || this.trickHistory.length === 0) return result;

        // 从最近一墩向前追：只要都是“我领主、我赢”，就仍处于同一轮控主/交接过程。
        // 找到最近的“主牌姐妹对/拖拉机”作为锚点。
        let chain = 0;
        for (let i=this.trickHistory.length-1; i>=0 && chain<8; i--) {
            let t = this.trickHistory[i];
            if (!t || t.leader !== pidx || t.winner !== pidx || !t.leadTrump) break;
            chain++;
            let pairCount = (typeof t.leadPairCount === 'number')
                ? t.leadPairCount
                : this.getPairs((t.plays && t.plays[pidx]) || []).length;
            let wasPairChain = !!t.leadWasTractor || pairCount >= 2;
            if (wasPairChain) {
                result.active = true;
                result.anchorFound = true;
                result.chainLength = chain;
                // 锚点本身不算“交权尝试”。锚点后每多赢一墩单张主，说明一次小主交权没有成功。
                result.handoffAttempts = Math.max(0, chain - 1);
                result.canAttemptHandoff = result.handoffAttempts < 1;
                result.reasons.push(`刚用主牌姐妹对/拖拉机控主并连续拿权${chain}墩`);
                if (result.handoffAttempts > 0) result.reasons.push('小主交权已尝试过，不再无目的连续钓主');
                break;
            }
        }
        return result;
    }

    // 找“交给对家”的最低成本小主。优先：无分、非王、不拆对子、权重最低。
    chooseSmallTrumpHandoffCard(pidx) {
        let hand = this.hands[pidx] || [];
        let trumps = hand.filter(c=>c.isTrump);
        if (trumps.length === 0) return null;
        let pairIds = new Set(this.getPairs(trumps).flat().map(c=>c.id));
        let cost = c => {
            let v = c.weight;
            if (c.score > 0) v += 5000 + c.score*100;
            if (c.rankIdx >= 13) v += 12000; // 大小王最后考虑
            if (pairIds.has(c.id)) v += 2500; // 尽量不拆主对子
            return v;
        };
        let noScoreNonJoker = trumps.filter(c=>c.score===0 && c.rankIdx<13);
        let pool = noScoreNonJoker.length ? noScoreNonJoker : trumps;
        return [...pool].sort((a,b)=>cost(a)-cost(b))[0] || null;
    }

    // Phase 2.5：判断自己手中的某个副牌对子是否已因历史信息形成控制。
    // 例如上一轮同门对子已经让两个对手都用散牌跟过，则他们以后不可能重新出现同门对子。
    isProspectiveOffSuitPairControl(pidx, pair) {
        if (!pair || pair.length < 2 || pair[0].isTrump) return false;
        let suit = pair[0].suit;
        let noHigherPairType = this.countPossibleHigherPairTypes(pidx, pair) === 0;
        let opponents = [(pidx+1)%4, (pidx+3)%4];
        return opponents.every(o => {
            if (this.voidMap[o][suit]) {
                return this.voidMap[o][4] || this.hasConfirmedNoPairRemaining(o, 4);
            }
            return this.hasConfirmedNoPairRemaining(o, suit) || noHigherPairType;
        });
    }

    // Phase 2.5：评估“继续钓主以后，副牌有没有兑现价值”。
    // 只使用公开信息：自己的手牌 + 已公开断门信息 + 已出牌。
    getOffSuitCashoutSummary(pidx) {
        let hand = this.hands[pidx] || [];
        let nonTrump = hand.filter(c => !c.isTrump);
        let controlledIds = new Set();

        // 单张已成该门顶张。
        for (let c of nonTrump) {
            if (this.countPossibleHigherSingles(pidx, c) === 0) controlledIds.add(c.id);
        }

        // 对子已成该门顶对，则整对都视为可兑现资产。
        for (let pair of this.getPairs(nonTrump)) {
            if (this.countPossibleHigherPairTypes(pidx, pair) === 0 || this.isProspectiveOffSuitPairControl(pidx, pair)) {
                pair.forEach(c => controlledIds.add(c.id));
            }
        }

        // “独门副牌”：其余三家都已经通过公开跟牌确认断了这门。
        // 这种长套在把别人主牌耗尽后会自然变成控制牌。
        let exclusiveSuits = [];
        for (let suit=0; suit<4; suit++) {
            let mine = nonTrump.filter(c => c.suit === suit);
            if (mine.length === 0) continue;
            let others = [0,1,2,3].filter(seat => seat !== pidx);
            if (others.every(seat => this.voidMap[seat][suit])) exclusiveSuits.push(suit);
        }

        let allControlled = nonTrump.length > 0 && nonTrump.every(c => controlledIds.has(c.id));
        let weakCards = nonTrump.filter(c => !controlledIds.has(c.id) && !exclusiveSuits.includes(c.suit));
        return {
            nonTrumpCount: nonTrump.length,
            controlledCount: controlledIds.size,
            allControlled,
            exclusiveSuits,
            weakCount: weakCards.length,
            weakCards
        };
    }

    // 单张钓主必须有“目的”：
    // ① 刚用姐妹对/拖拉机钓主后，只允许一次小主交权尝试；
    // ② 自己剩余副牌已经基本都是控制牌；
    // ③ 已公开确认有一门副牌只有自己还有，值得先耗光别人主牌。
    // 否则继续单张钓主只是帮对手消耗自己的控制力。
    evaluateTrumpFishingPurpose(pidx, cards, publicState=null) {
        let result = { meaningful:false, reasons:[], cashout:null, firstHandoff:false };
        if (!cards || cards.length === 0 || !cards[0].isTrump) return result;
        publicState = publicState || this.buildPublicState(pidx);
        let cashout = this.getOffSuitCashoutSummary(pidx);
        result.cashout = cashout;

        if (cashout.nonTrumpCount === 0) {
            result.meaningful = true;
            result.reasons.push('手中已无副牌，只能继续主牌');
            return result;
        }
        if (cashout.allControlled) {
            result.meaningful = true;
            result.reasons.push('剩余副牌均为公开信息下的控制牌，钓主后可兑现');
            return result;
        }
        if (cashout.exclusiveSuits.length > 0) {
            result.meaningful = true;
            result.reasons.push(`已确认${cashout.exclusiveSuits.map(s=>SUITS[s]).join('/')}只有自己还有，耗主后长套可兑现`);
            return result;
        }

        let handoff = this.getTrumpControlHandoffContext(pidx);
        let small = this.chooseSmallTrumpHandoffCard(pidx);
        if (cards.length === 1 && handoff.active && handoff.canAttemptHandoff && small && cards[0].id === small.id) {
            result.meaningful = true;
            result.firstHandoff = true;
            result.reasons.push('姐妹对/拖拉机钓主后第一次用小主交权给对家');
            return result;
        }

        result.reasons.push(`副牌尚有${cashout.weakCount}张未形成控制，继续单张钓主缺少兑现目标`);
        return result;
    }

    // “大副牌/确定控制牌”判定：不是凭感觉，而是只用公开信息。
    // 单张要求已无更大同门未知；对子要求已无更大对子类型未知；拖拉机则要求很高的预计控权率。
    isStrongOffSuitControlCandidate(pidx, cards, publicState=null) {
        if (!cards || cards.length===0 || cards[0].isTrump) return false;
        publicState = publicState || this.buildPublicState(pidx);
        let winChance = this.estimateLeadWinChance(pidx, cards, publicState);
        let pairs = this.getPairs(cards);
        if (cards.length === 1) {
            return this.countPossibleHigherSingles(pidx, cards[0]) === 0 && winChance >= 0.72;
        }
        if (cards.length === 2 && pairs.length === 1) {
            let pairControlled = this.countPossibleHigherPairTypes(pidx, pairs[0]) === 0 || this.isProspectiveOffSuitPairControl(pidx, pairs[0]);
            return pairControlled && winChance >= 0.72;
        }
        if (this.isPureTractor(cards)) {
            let topPair = pairs.slice().sort((a,b)=>b[0].weight-a[0].weight)[0];
            return this.countPossibleHigherPairTypes(pidx, topPair) === 0 && winChance >= 0.76;
        }
        return false;
    }

    estimateLeadWinChance(pidx, cards, publicState=null) {
        if (!cards || cards.length === 0) return 0;
        publicState = publicState || this.buildPublicState(pidx);
        let first = cards[0];
        let leadTrump = first.isTrump;
        let opponents = [(pidx+1)%4, (pidx+3)%4];

        // 断门对手若仍可能有主，会显著增加副牌被毙风险。
        let ruffRisk = 0;
        if (!leadTrump) {
            for (let o of opponents) {
                if (this.voidMap[o][first.suit] && !this.voidMap[o][4]) ruffRisk += 0.26;
            }
        }

        if (cards.length === 1) {
            let higher = this.countPossibleHigherSingles(pidx, first);
            let chance = 0.92 - Math.min(0.72, higher * 0.075) - ruffRisk;
            if (!leadTrump && first.rankIdx === 12) chance += 0.06;
            return Math.max(0.08, Math.min(0.98, chance));
        }

        let pairs = this.getPairs(cards);
        if (cards.length === 2 && pairs.length === 1) {
            let higherPairTypes = this.countPossibleHigherPairTypes(pidx, pairs[0]);
            let chance = 0.91 - Math.min(0.68, higherPairTypes * 0.12) - ruffRisk;
            return Math.max(0.08, Math.min(0.98, chance));
        }

        if (this.isPureTractor(cards)) {
            let topPair = pairs.slice().sort((a,b)=>b[0].weight-a[0].weight)[0];
            let higherPairTypes = this.countPossibleHigherPairTypes(pidx, topPair);
            let chance = 0.88 - Math.min(0.58, higherPairTypes * 0.09) - ruffRisk;
            chance += Math.min(0.08, (pairs.length-2) * 0.03);
            return Math.max(0.08, Math.min(0.96, chance));
        }

        // Phase 2.6：AKK姐妹对 = A单张控制 + K对子控制，两部分都要安全。
        if (this.isAKKSisterCombo(cards)) {
            let ace = cards.find(c => c.rankIdx === 12);
            let kp = this.getPairs(cards).find(p => p[0].rankIdx === 11);
            let higherSingles = ace ? this.countPossibleHigherSingles(pidx, ace) : 99;
            let higherPairs = kp ? this.countPossibleHigherPairTypes(pidx, kp) : 99;
            let singleChance = 0.96 - Math.min(0.45, higherSingles*0.08) - ruffRisk;
            let pairChance = 0.92 - Math.min(0.60, higherPairs*0.12) - ruffRisk;
            return Math.max(0.08, Math.min(0.97, Math.min(singleChance, pairChance)));
        }

        // 【修复6】可证明必胜的甩牌：同门已无更大未知牌，胜率按高位估。
        if (this.phase3IsProvablySafeThrow(pidx, cards, publicState)) {
            return Math.max(0.5, Math.min(0.96, 0.94 - ruffRisk));
        }
        // 其余复杂甩牌：在不知道暗牌的前提下保守估值；最终合法性仍由裁判层判定。
        return Math.max(0.12, 0.55 - ruffRisk);
    }



    // =====================================================================
    // Phase 3 Core：统一公开推理、合法动作候选、团队战术评估
    // =====================================================================
    resetPhase3Inference() {
        this.publicPlayLedger = [];
        this.inferenceState = {
            confirmedNoPair: Array.from({length:4}, () => [false,false,false,false,false]),
            confirmedNoTractor: Array.from({length:4}, () => ({}))
        };
    }

    phase3SeatMayHaveTrump(seat, perspectiveIdx) {
        if (seat < 0 || seat > 3) return false;
        if ((this.hands[seat] || []).length === 0) return false;
        if (this.voidMap && this.voidMap[seat] && this.voidMap[seat][4]) return false;
        let ps = this.buildPublicState(perspectiveIdx);
        return ps.unknownTrump > 0;
    }

    phase3CommitInferenceFromCompletedTrick() {
        if (!this.inferenceState) this.resetPhase3Inference();
        if (this.firstPlayerOfRound === -1) return;
        let lead = this.played[this.firstPlayerOfRound] || [];
        if (lead.length === 0) return;
        let group = lead[0].isTrump ? 4 : lead[0].suit;
        let leadPairs = this.getPairs(lead);
        let pairCount = leadPairs.length;
        let leadTractor = this.isPureTractor(lead);
        for (let seat=0; seat<4; seat++) {
            if (seat === this.firstPlayerOfRound) continue;
            let play = this.played[seat] || [];
            let relevant = group === 4
                ? play.filter(c=>c.isTrump)
                : play.filter(c=>!c.isTrump && c.suit===group);
            if (pairCount > 0) {
                let followedPairs = this.getPairs(relevant).length;
                // 少于领出的对子数，说明其当时所有可用对子均已被迫打出；以后不可能重新长出对子。
                if (followedPairs < pairCount) this.inferenceState.confirmedNoPair[seat][group] = true;
            }
            if (leadTractor && pairCount >= 2) {
                let followedTractor = this.getTractorWindows(relevant, pairCount).length > 0;
                if (!followedTractor) this.inferenceState.confirmedNoTractor[seat][`${group}:${pairCount}`] = true;
            }
        }
    }

    phase3TypeRecordsForGroup(pidx, group) {
        let ps = this.buildPublicState(pidx);
        let rows = [];
        for (let suit=0; suit<4; suit++) {
            for (let rankIdx=0; rankIdx<13; rankIdx++) {
                let info = this.getTypeInfo(suit, rankIdx);
                let belongs = group===4 ? info.isTrump : (!info.isTrump && suit===group);
                if (!belongs) continue;
                rows.push({suit, rankIdx, weight:info.weight,
                    remain:ps.unknownByType.get(this.cardTypeKey(suit,rankIdx))||0});
            }
        }
        if (group===4) {
            for (let rankIdx of [13,14]) {
                let info=this.getTypeInfo(4,rankIdx);
                rows.push({suit:4,rankIdx,weight:info.weight,
                    remain:ps.unknownByType.get(this.cardTypeKey(4,rankIdx))||0});
            }
        }
        // tractorId 是按唯一权重排序；同权重的副级牌不构成相邻两个梯级。
        let weights=[...new Set(rows.map(r=>r.weight))].sort((a,b)=>a-b);
        rows.forEach(r=>r.tid=weights.indexOf(r.weight));
        return rows;
    }

    phase3CountHigherTractorWindows(pidx, cards) {
        if (!cards || !this.isPureTractor(cards)) return 99;
        let pairs=this.getPairs(cards);
        let len=pairs.length;
        let group=cards[0].isTrump?4:cards[0].suit;
        let myMaxTid=Math.max(...pairs.map(p=>p[0].tractorId));
        let rows=this.phase3TypeRecordsForGroup(pidx,group);
        let byTid=new Map();
        for (let r of rows) {
            if (r.remain>=2) byTid.set(r.tid,true);
        }
        let tids=[...new Set(rows.map(r=>r.tid))].sort((a,b)=>a-b);
        let count=0;
        for (let i=0;i<=tids.length-len;i++) {
            let w=tids.slice(i,i+len);
            if (w.some((v,j)=>j>0 && v!==w[j-1]+1)) continue;
            if (w[w.length-1] <= myMaxTid) continue;
            if (w.every(t=>byTid.get(t))) count++;
        }
        return count;
    }

    phase3CountHigherStructures(pidx, cards) {
        if (!cards || cards.length===0) return 99;
        if (cards.length===1) return this.countPossibleHigherSingles(pidx,cards[0]);
        if (cards.length===2 && this.getPairs(cards).length===1) return this.countPossibleHigherPairTypes(pidx,cards);
        if (this.isPureTractor(cards)) return this.phase3CountHigherTractorWindows(pidx,cards);
        // 【修复6】可证明必胜的甩牌：同门已无更大未知牌，不该再当成99种威胁重罚。
        if (this.phase3IsProvablySafeThrow(pidx,cards)) return 0;
        return 99; // 其余复杂甩牌保守处理：除非裁判确认，不把它当“稳赢”。
    }

    phase3PendingOpponents(pidx) {
        let out=[];
        for (let seat=0;seat<4;seat++) {
            if (seat===pidx || seat%2===pidx%2) continue;
            if (!this.played[seat] || this.played[seat].length===0) out.push(seat);
        }
        return out;
    }

    phase3PendingCanBeatStructure(opp,pidx,winning,group,higher) {
        if (!winning || !winning.length || higher<=0) return false;
        if (winning.length===2 && this.getPairs(winning).length===1) {
            if (this.inferenceState && this.inferenceState.confirmedNoPair && this.inferenceState.confirmedNoPair[opp] && this.inferenceState.confirmedNoPair[opp][group]) return false;
        }
        if (this.isPureTractor(winning)) {
            let len=this.getPairs(winning).length;
            let key=`${group}:${len}`;
            if (this.inferenceState && this.inferenceState.confirmedNoTractor && this.inferenceState.confirmedNoTractor[opp] && this.inferenceState.confirmedNoTractor[opp][key]) return false;
        }
        return true;
    }

    phase3CurrentWinnerSecurity(pidx) {
        const winner=this.getWinner(),lead=this.played[this.firstPlayerOfRound]||[],winning=this.played[winner]||[];
        if(winner<0 || !lead.length) return {winner,secure:false,threats:99,risk:1,reasons:[]};
        const group=lead[0].isTrump?4:lead[0].suit, trump=winning.every(c=>c.isTrump);
        const accepted=this.phase4IsComplex(lead)&&winner===this.firstPlayerOfRound;
        const weight=this.phase4ContestWeight(winning,lead);
        let threats=0,survive=1;
        for(const opp of this.phase3PendingOpponents(pidx)) {
            const pv=group===4?0:this.phase3EstimateSeatVoidProbability(opp,group,pidx);
            let risk=0;
            if(group===4) {
                if(!accepted) risk=this.phase7StructureProbability(opp,pidx,lead,4,weight);
            } else if(trump) {
                risk=pv*this.phase7StructureProbability(opp,pidx,lead,4,weight,group);
            } else {
                if(!accepted) risk=(1-pv)*this.phase7StructureProbability(opp,pidx,lead,group,weight);
                risk+=pv*this.phase7StructureProbability(opp,pidx,lead,4,-Infinity,group);
            }
            if(risk>0) threats++;
            survive*=1-Math.min(1,risk);
        }
        return {winner,secure:threats===0,threats,risk:1-survive,
            reasons:threats?[`后手反超风险估计${((1-survive)*100).toFixed(1)}%：按剩余张数、同门大牌及匹配主牌结构推算，非保证`]:['公开信息已排除后手反超']};
    }

    // Only the actor's hand and public facts enter this estimate. Unknown-card allocation
    // is a model, not a statement that a particular opponent owns a particular card.
    phase7WithDecisionCache(fn) {
        const old=this.phase7DecisionCache;
        this.phase7DecisionCache=new Map();
        try {return fn();} finally {this.phase7DecisionCache=old;}
    }

    phase7StructureProbability(seat,pidx,lead,group,above=-Infinity,excluded=-1) {
        const cache=this.phase7DecisionCache;
        if(!cache)return this.phase7ComputeStructureProbability(seat,pidx,lead,group,above,excluded);
        const key=`${seat}:${pidx}:${group}:${above}:${excluded}:${lead.map(c=>c.id).join(',')}`;
        if(!cache.has(key))cache.set(key,this.phase7ComputeStructureProbability(seat,pidx,lead,group,above,excluded));
        return cache.get(key);
    }

    phase7ComputeStructureProbability(seat,pidx,lead,group,above=-Infinity,excluded=-1) {
        if(!this.phase4SeatCanSupply(seat,pidx,lead,group)) return 0;
        const ps=this.buildPublicState(pidx),h=this.hands[seat].length;
        const allowed=[0,1,2,3,4].filter(g=>g!==excluded&&!this.voidMap[seat][g]);
        const N=allowed.reduce((n,g)=>n+(g===4?ps.unknownTrump:ps.unknownBySuit[g]),0);
        const rows=this.phase3TypeRecordsForGroup(pidx,group),K=rows.reduce((n,r)=>n+r.remain,0);
        if(N<h || K<lead.length) return 1; // inconsistent model: never invent certainty
        const enough=this.phase3HypergeomAtLeast(N,K,h,lead.length);
        const pool=rows.flatMap(r=>Array.from({length:r.remain},(_,n)=>({id:`v7:${r.suit}:${r.rankIdx}:${n}`,
            suit:r.suit,rankIdx:r.rankIdx,weight:r.weight,tractorId:r.tid,isTrump:group===4,score:0})));
        const pairCount=this.getPairs(lead).length;
        if(!pairCount) {
            const high=pool.filter(c=>c.weight>above).length;
            if(!high)return 0;
            return this.phase7GroupedProbability(N,K,h,lead.length,(x,choose)=>1-choose(K-high,x)/choose(K,x));
        }
        if(!this.getAllTractors(lead).length) {
            const ways=this.phase7PairHoldWays(rows,pairCount,above,Math.min(K,h));
            return this.phase7GroupedProbability(N,K,h,lead.length,(x,choose)=>ways(x)/choose(K,x));
        }
        const limit=257,cores=this.phase4StructureCores(pool,lead,limit),seen=new Set();
        let chance=0;
        for(const core of cores) {
            const key=core.map(c=>c.id).sort().join('|');if(seen.has(key))continue;seen.add(key);
            if(this.phase4ContestWeight(core,lead)<=above)continue;
            const k=core.length;if(k>h)continue;
            let p=1;for(let i=0;i<k;i++)p*=(h-i)/(N-i);
            p*=this.phase3HypergeomAtLeast(N-k,K-k,h-k,lead.length-k);
            chance+=p;
        }
        // Enumeration cap must not silently turn missing structures into a safe result.
        if(cores.length>=limit)return enough;
        return Math.min(enough,chance);
    }

    phase7GroupedProbability(N,K,h,need,ways) {
        const choose=(n,k)=>{if(k<0||k>n)return 0;let v=1;for(let i=1;i<=Math.min(k,n-k);i++)v*= (n-i+1)/i;return v;};
        let p=0;
        for(let x=need;x<=Math.min(K,h);x++) {
            const mass=this.phase3HypergeomAtLeast(N,K,h,x)-this.phase3HypergeomAtLeast(N,K,h,x+1);
            if(mass>0)p+=mass*ways(x,choose);
        }
        return Math.max(0,Math.min(1,p));
    }

    phase7PairHoldWays(rows,required,above,maxCount) {
        // Count suit-card subsets with enough identical pairs; cap pair count at requirement.
        let dp=new Map([['0:0:0',1]]);
        for(const r of rows.filter(r=>r.remain>0)) {
            const next=new Map();
            for(const [key,ways] of dp) {
                const [n,p,b]=key.split(':').map(Number);
                for(let take=0;take<=r.remain&&n+take<=maxCount;take++) {
                    const pair=take===2,nn=n+take,pp=Math.min(required,p+(pair?1:0));
                    const bb=b||(pair&&r.weight>above)?1:0,k=`${nn}:${pp}:${bb}`;
                    const w=take===1?r.remain:1;next.set(k,(next.get(k)||0)+ways*w);
                }
            }
            dp=next;
        }
        return x=>dp.get(`${x}:${required}:1`)||0;
    }

    phase7ShortSuitSignal(seat,suit) {
        // Losing a K/10 while following is a short-suit clue, never confirmed void.
        const recent=(this.trickHistory||[]).slice(-4);
        for(let i=recent.length-1;i>=0;i--) {
            const t=recent[i];if(t.leadTrump||t.leadSuit!==suit)continue;
            const cards=(t.plays[seat]||[]).filter(c=>!c.isTrump&&c.suit===suit);
            if(!cards.length)return 0;
            if(t.winner%2!==seat%2 && cards.some(c=>c.score>=10))
                return cards.some(c=>c.rankIdx===11)?0.65:0.55;
            return 0;
        }
        return 0;
    }

    phase3SimulateCandidate(pidx,cards) {
        const old=this.played[pidx];
        try {
            this.played[pidx]=cards;
            const security=this.phase3CurrentWinnerSecurity(pidx);
            return {winner:security.winner,secure:security.secure,threats:security.threats,risk:security.risk,reasons:security.reasons};
        } finally { this.played[pidx]=old; }
    }

    phase3CardOpportunityCost(pidx, cards) {
        let hand=this.hands[pidx]||[];
        let pairIds=new Set(this.getPairs(hand).flat().map(c=>c.id));
        let v=0;
        for (let c of cards) {
            let cv=0;
            if (c.isTrump) {
                if (c.rankIdx===14) cv+=30;
                else if (c.rankIdx===13) cv+=25;
                else if (c.weight>=700) cv+=16;
                else cv+=4 + Math.max(0,c.weight-100)*0.12;
            } else {
                cv += Math.max(0,c.rankIdx-7)*1.3;
                if (c.rankIdx===12) cv+=6;
            }
            cv += c.score*0.65;
            if (pairIds.has(c.id)) cv+=4.5;
            v+=cv;
        }
        if (this.isPureTractor(cards)) v+=8;
        for(const t of this.getAllTractors(hand)) {
            const flat=t.flat(), used=flat.filter(c=>cards.includes(c)).length;
            if(used>0 && used<flat.length) v+=35;
        }
        return v;
    }

    phase3UniqueAdd(arr, seen, cards, tag) {
        if (!cards || cards.length===0 || cards.some(x=>!x)) return;
        let key=cards.map(c=>c.id).sort((a,b)=>a-b).join('-');
        if (seen.has(key)) return;
        seen.add(key); arr.push({cards:[...cards],tag});
    }

    phase3ChooseCombos(arr,k,limit=100) {
        let out=[];
        const dfs=(start,picked)=>{
            if (out.length>=limit) return;
            if (picked.length===k) {out.push([...picked]);return;}
            for (let i=start;i<arr.length;i++) dfs(i+1,[...picked,arr[i]]);
        };
        if (k===0) return [[]];
        dfs(0,[]); return out;
    }

    phase3FillVariants(cards,k,pidx) {
        if (k<=0) return [[]];
        if (cards.length<k) return [];
        let variants=[]; let seen=new Set();
        const add=a=>{let key=a.map(c=>c.id).sort((x,y)=>x-y).join('-'); if(!seen.has(key)){seen.add(key);variants.push(a)}};
        let low=[...cards].sort((a,b)=>this.phase3CardOpportunityCost(pidx,[a])-this.phase3CardOpportunityCost(pidx,[b])).slice(0,k);
        let high=[...cards].sort((a,b)=>b.weight-a.weight).slice(0,k);
        let points=[...cards].sort((a,b)=>b.score-a.score || a.weight-b.weight).slice(0,k);
        add(low);add(high);add(points);
        // One sufficient high anchor plus cheap fillers; do not force all-low/all-high.
        if(k>1) for(const anchor of cards) {
            const rest=cards.filter(c=>c!==anchor).sort((a,b)=>this.phase3CardOpportunityCost(pidx,[a])-this.phase3CardOpportunityCost(pidx,[b]));
            add([anchor,...rest.slice(0,k-1)]);
        }
        if (k===1) for (let c of cards) add([c]);
        return variants.slice(0,80);
    }

    phase3GenerateFollowCandidates(pidx) {
        let first=this.played[this.firstPlayerOfRound];
        if (!first || first.length===0) return [];
        let hand=this.hands[pidx];
        let n=first.length;
        let leadTrump=first[0].isTrump;
        let leadSuit=leadTrump?4:first[0].suit;
        let mySame=hand.filter(c=>leadTrump?c.isTrump:(!c.isTrump&&c.suit===leadSuit));
        let leadPairs=this.getPairs(first);
        let leadPairCount=leadPairs.length;
        let leadTractor=this.isPureTractor(first);
        let arr=[],seen=new Set();
        const add=(cards,tag)=>{
            if (!cards || cards.length!==n) return;
            if (!this.isValidPlay(pidx,cards,true)) return;
            this.phase3UniqueAdd(arr,seen,cards,tag);
        };

        // 对混合甩牌，也生成“完整拖拉机 + 独立对子 + 补张”的候选。
        if(this.getAllTractors(first).length) {
            const source=mySame.length>=n?mySame:(mySame.length===0?hand.filter(c=>c.isTrump):[]);
            for(const core of this.phase4StructureCores(source,first)) {
                const rest=source.filter(c=>!core.includes(c));
                for(const fill of this.phase3FillVariants(rest,n-core.length,pidx)) add([...core,...fill],'完整匹配甩牌结构');
            }
        }
        if (mySame.length>=n) {
            if (leadTractor) {
                let windows=this.getTractorWindows(mySame,leadPairCount);
                if (windows.length>0) for (let w of windows) add(w.flat(),'同门拖拉机');
            }
            if (arr.length===0 && leadPairCount>0) {
                let pairs=this.getPairs(mySame);
                let required=Math.min(pairs.length,leadPairCount);
                for (let pc of this.phase3ChooseCombos(pairs,required,80)) {
                    let base=pc.flat();
                    let rest=mySame.filter(c=>!base.includes(c));
                    for (let fill of this.phase3FillVariants(rest,n-base.length,pidx)) add([...base,...fill],'同门对子结构');
                }
            }
            if (arr.length===0) {
                for (let fill of this.phase3FillVariants(mySame,n,pidx)) add(fill,'同门跟牌');
            }
        } else {
            let base=[...mySame];
            let rest=hand.filter(c=>!base.includes(c));
            let need=n-base.length;
            for (let fill of this.phase3FillVariants(rest,need,pidx)) add([...base,...fill],'缺门垫牌');
            if (base.length===0) {
                let trumps=hand.filter(c=>c.isTrump);
                if (n===1) for (let c of trumps) add([c],'单主毙牌');
                // 【修复5】原来只有“领出单张”“领出纯对子/纯拖拉机”这两种形状才会生成毙牌候选。
                // 对手甩牌（例如 ♦A+♦K♦K 共3张）时 n!==leadPairCount*2，断门的电脑一张毙牌
                // 候选都生成不出来，只能垫牌白送分。这里补上通用毙牌生成：
                // 先按领出牌型凑够“主拖拉机 / 主对子”，再用剩余主牌补足张数。
                if (n>1 && trumps.length>=n) {
                    if (leadTractor) {
                        for (let w of this.getTractorWindows(trumps,leadPairCount)) {
                            let core=w.flat();
                            let rest=trumps.filter(c=>!core.includes(c));
                            for (let fill of this.phase3FillVariants(rest,n-core.length,pidx)) add([...core,...fill],'主拖拉机毙牌');
                        }
                    } else if (leadPairCount>0) {
                        let tp=this.getPairs(trumps);
                        if (tp.length>=leadPairCount) {
                            for (let pc of this.phase3ChooseCombos(tp,leadPairCount,40)) {
                                let core=pc.flat();
                                let rest=trumps.filter(c=>!core.includes(c));
                                for (let fill of this.phase3FillVariants(rest,n-core.length,pidx)) add([...core,...fill],'主对子毙牌');
                            }
                        }
                    } else {
                        // 领出的是全单张甩牌：全主牌毙即可，比大小只看最大单张。
                        for (let fill of this.phase3FillVariants(trumps,n,pidx)) add(fill,'全主毙牌');
                    }
                }
            }
        }
        return arr;
    }


    // Phase 3.1：识别“已经成功落桌的复杂甩牌”。
    // 这类甩牌既然已经被裁判接受，就说明同门内部的单张/对子/拖拉机单元
    // 没有被任何对手用更大的同结构直接反压。真正剩下的主要风险，是后手断门后
    // 是否有足够多主牌整组毙掉。因此不能再把复杂甩牌一律当成“99种未知威胁”。
    phase3IsAcceptedComplexThrow(cards) {
        if (!cards || cards.length < 3) return false;
        if (cards.length === 2 && this.getPairs(cards).length === 1) return false;
        if (this.isPureTractor(cards)) return false;
        // AKK也属于通过裁判的复杂甩牌，可给分。
        let g = cards[0].isTrump ? 4 : cards[0].suit;
        if (!cards.every(c => (c.isTrump ? 4 : c.suit) === g)) return false;
        return true;
    }

    // 小规模超几何分布：从N张未知牌中有K张目标牌，某座位有n张牌，
    // 估算至少拿到k张目标牌的概率。只使用公开牌数，不读取该座位暗牌。
    phase3HypergeomAtLeast(N, K, n, k) {
        N = Math.max(0, Math.floor(N));
        K = Math.max(0, Math.min(N, Math.floor(K)));
        n = Math.max(0, Math.min(N, Math.floor(n)));
        k = Math.max(0, Math.floor(k));
        if (k <= 0) return 1;
        if (n < k || K < k) return 0;
        let maxX = Math.min(K, n);
        let minX = Math.max(k, n - (N - K));
        if (minX > maxX) return 0;

        const logC = (a,b) => {
            if (b < 0 || b > a) return -Infinity;
            b = Math.min(b, a-b);
            let s = 0;
            for (let i=1;i<=b;i++) s += Math.log(a-b+i) - Math.log(i);
            return s;
        };
        let denom = logC(N,n);
        let sum = 0;
        for (let x=minX;x<=maxX;x++) {
            let lp = logC(K,x) + logC(N-K,n-x) - denom;
            sum += Math.exp(lp);
        }
        return Math.max(0, Math.min(1, sum));
    }

    phase3SeatRecentlyFollowedSuit(seat, suit, lookback=3) {
        let recent=(this.trickHistory||[]).slice(-lookback);
        for (let i=recent.length-1;i>=0;i--) {
            let t=recent[i];
            if (!t || t.leadTrump || t.leadSuit!==suit || !t.plays || !t.plays[seat]) continue;
            let pp=t.plays[seat]||[];
            if (pp.some(c=>!c.isTrump && c.suit===suit)) return true;
        }
        return false;
    }

    phase3EstimateSeatVoidProbability(seat,suit,pidx) {
        if(this.voidMap[seat][suit]) return 1;
        const bounds=this.phase5SuitBounds(pidx).seats.find(x=>x.seat===seat);
        if(bounds && bounds.hi[suit]===0) return 1;
        if(bounds && bounds.lo[suit]>0) return 0;
        const ps=this.buildPublicState(pidx), h=this.hands[seat].length;
        if(h<=0) return 1;
        // 只在该座位尚可能持有的门中估计；不能把其已断的花色继续放进样本池。
        const allowed=[0,1,2,3,4].filter(g=>!this.voidMap[seat][g]);
        const total=allowed.reduce((n,g)=>n+(g===4?ps.unknownTrump:ps.unknownBySuit[g]),0);
        const suitTotal=ps.unknownBySuit[suit];
        if(suitTotal===0) return 1;
        // 曾经跟过某门不意味着现在仍有；不再机械把断门概率乘0.35。
        return Math.max(this.phase7ShortSuitSignal(seat,suit),Math.min(1,1-this.phase3HypergeomAtLeast(total,suitTotal,h,1)));
    }

    phase3EstimateSeatCanFullRuff(seat, pidx, needCount) {
        if (!this.phase3SeatMayHaveTrump(seat,pidx)) return 0;
        let h=(this.hands[seat]||[]).length;
        if (h < needCount) return 0;
        let ps=this.buildPublicState(pidx);
        return this.phase3HypergeomAtLeast(ps.unknownTotal, ps.unknownTrump, h, needCount);
    }

    // 成功复杂甩牌的“控制置信度”。
    // 同门能否压住已经由甩牌成功这一公开事实高度确认；
    // 这里只估算后手是否可能完全断门并拥有足够多主牌整组毙掉。
    phase3ComplexThrowControl(pidx) {
        let out={
            active:false, confidence:0, partner:-1, leader:this.firstPlayerOfRound,
            lead:[], pending:[], ruffRisks:[], reasons:[]
        };
        let partner=(pidx+2)%4;
        out.partner=partner;
        if (this.firstPlayerOfRound!==partner) return out;
        let lead=this.played[this.firstPlayerOfRound]||[];
        if (!this.phase3IsAcceptedComplexThrow(lead)) return out;

        let cur=this.getWinner();
        // 已经有对手用主牌毙上来时，不能再把原甩牌当成控制牌。
        if (cur!==-1 && cur%2!==pidx%2) return out;

        out.active=true; out.lead=lead;
        let pending=this.phase3PendingOpponents(pidx);
        out.pending=pending;
        if (pending.length===0) {
            out.confidence=1;
            out.reasons.push('复杂甩牌已成功落桌，且后手已无对手：确定收墩');
            return out;
        }
        if (lead[0].isTrump) {
            // 主牌复杂甩牌既然已成功，后手不存在“另门毙牌”问题。
            out.confidence=0.995;
            out.reasons.push('主牌复杂甩牌已经裁判确认成功：后手只能跟主，控制极高');
            return out;
        }

        let suit=lead[0].suit;
        let totalSurvive=1;
        for (let opp of pending) {
            let pVoid=this.phase3EstimateSeatVoidProbability(opp,suit,pidx);
            let pEnoughTrump=this.phase4SeatCanSupply(opp,pidx,lead,4)?this.phase3EstimateSeatCanFullRuff(opp,pidx,lead.length):0;
            // 匹配结构与主牌数量一起计算，不把“足够多主”当成“有主对子”。
            let risk=Math.max(0,Math.min(0.98,pVoid*pEnoughTrump));
            out.ruffRisks.push({seat:opp,pVoid,pEnoughTrump,risk});
            totalSurvive*=1-risk;
        }
        out.confidence=Math.max(0.05,Math.min(0.995,totalSurvive));
        out.reasons.push(`甩牌已成功：同门反压风险基本排除`);
        out.reasons.push(`后手整组主牌反毙估计风险 ${(100*(1-out.confidence)).toFixed(1)}%`);
        if (lead.length>=7) out.reasons.push(`${lead.length}张大甩牌要求后手至少有${lead.length}张主才能整组毙，反毙门槛很高`);
        return out;
    }

    // 大甩牌投分策略：不是要求100%“稳赢”才投。
    // 当甩牌已成功且控制置信度高时，应趁这一墩把规则允许范围内的分尽量送给对家，
    // 否则把10/K一直捏到后面反而可能被敌方抓走。
    phase3ChooseComplexThrowFeed(pidx,candidates) {
        let ctx=this.phase3ComplexThrowControl(pidx);
        if (!ctx.active || ctx.confidence < 0.72) return null;

        let choices=[];
        for (let x of candidates) {
            let pts=x.cards.reduce((s,c)=>s+c.score,0);
            if (pts<=0) continue;
            let sim=this.phase3SimulateCandidate(pidx,x.cards);
            // 自己跟完以后至少仍应由我方领先；否则不能为了投分把牌权直接送掉。
            if (sim.winner===-1 || sim.winner%2!==pidx%2) continue;
            let cost=this.phase3CardOpportunityCost(pidx,x.cards);
            // 高置信度时“先看能投多少分”，中等置信度时仍保留牌力成本。
            let expected=pts*(ctx.confidence*18-(1-ctx.confidence)*24)-cost*0.35;
            choices.push({...x,pts,cost,expected,sim});
        }
        if (!choices.length) return null;

        if (ctx.confidence>=0.84) {
            choices.sort((a,b)=>b.pts-a.pts || b.expected-a.expected || a.cost-b.cost);
        } else {
            choices.sort((a,b)=>b.expected-a.expected || b.pts-a.pts || a.cost-b.cost);
        }
        let b=choices[0];
        if (b.expected<=0 && ctx.confidence<0.84) return null;
        return {
            cards:b.cards,
            kind:'成功大甩牌高置信度投分',
            score:b.expected,
            reasons:[
                ...ctx.reasons,
                `当前控制置信度 ${(ctx.confidence*100).toFixed(0)}%`,
                `本手规则允许投出${b.pts}分：趁高控制墩兑现分牌`,
                `不是机械等到100%确定才投，避免分牌后续反被敌方抓走`
            ],
            throwControl:ctx
        };
    }

    phase3PartnerPointUrgency(pidx) {
        let partner=(pidx+2)%4;
        let pcards=this.played[partner]||[];
        let ppoints=pcards.reduce((s,c)=>s+c.score,0);
        let table=0; this.played.forEach(p=>(p||[]).forEach(c=>table+=c.score));
        return {partner,partnerPoints:ppoints,tablePoints:table,pending:this.phase3PendingOpponents(pidx)};
    }

    phase3ChoosePartnerProtection(pidx,candidates) {
        const ctx=this.phase3PartnerPointUrgency(pidx), cur=this.getWinner();
        if(cur!==ctx.partner || !ctx.pending.length || ctx.tablePoints<10) return null;
        const now=this.phase3CurrentWinnerSecurity(pidx);
        if(now.secure || now.risk<=this.phase7FeedRiskLimit()) return null;
        let choices=candidates.map(x=>({ ...x,sim:this.phase3SimulateCandidate(pidx,x.cards),cost:this.phase3CardOpportunityCost(pidx,x.cards)}))
            .filter(x=>x.sim.winner===pidx && (x.sim.secure || x.sim.risk<now.risk-0.05));
        choices.sort((a,b)=>(a.sim.secure?0:1)-(b.sim.secure?0:1) || a.sim.risk-b.sim.risk || a.cost-b.cost);
        const b=choices[0];
        if(!b) return null;
        return {cards:b.cards,kind:'V9 对家分牌护航',score:100*(1-b.sim.risk)-b.cost,
            reasons:[`我方暂时领先，但桌面${ctx.tablePoints}分仍可能被后手抢走`,b.sim.secure?'以最低代价封住后手':'降低后手压过或反毙风险，不把未知断门当作安全']};
    }

    phase3ChooseMandatoryEnemyRuff(pidx,candidates) {
        const cur=this.getWinner(), lead=this.played[this.firstPlayerOfRound]||[];
        if(cur<0 || cur%2===pidx%2 || !lead.length || lead[0].isTrump) return null;
        if(this.hands[pidx].some(c=>!c.isTrump && c.suit===lead[0].suit)) return null;
        const table=this.played.flat().reduce((n,c)=>n+c.score,0);
        const last=this.hands[pidx].length===lead.length;
        let winners=candidates.map(x=>({...x,sim:this.phase3SimulateCandidate(pidx,x.cards),cost:this.phase3CardOpportunityCost(pidx,x.cards)}))
            .filter(x=>x.sim.winner===pidx);
        winners.forEach(x=>x.value=(100+table*6)*(1-x.sim.risk)-x.cost*0.35);
        winners.sort((a,b)=>b.value-a.value);
        let b=winners[0]; if(!b) return null;
        // 零分、无后续大牌、且必须拆对/用王，才允许不抢这一墩。
        const rest=this.hands[pidx].filter(c=>!b.cards.includes(c));
        const followup=rest.some(c=>!c.isTrump && this.countPossibleHigherSingles(pidx,c)===0);
        const breaks=this.getPairs(this.hands[pidx].filter(c=>c.isTrump)).some(p=>p.filter(c=>b.cards.includes(c)).length===1);
        const expensive=breaks || b.cards.some(c=>c.rankIdx>=13);
        if(!last && table===0 && expensive && !followup && candidates.some(x=>this.phase3SimulateCandidate(pidx,x.cards).winner!==pidx)) return null;
        return {cards:b.cards,kind:'V9 断门毙牌抢权',score:b.value,
            reasons:[last?'最后一墩，优先保底或抠底':'敌方领先且我已断门，优先毙回牌权',b.sim.secure?'最低充分主牌可封口':'兼顾反毙风险、分数与主牌成本']};
    }

    phase3ScoreFollowCandidate(pidx,cards) {
        let cur=this.getWinner();
        let curTeam=cur!==-1 && cur%2===pidx%2;
        let curSecurity=this.phase3CurrentWinnerSecurity(pidx);
        let sim=this.phase3SimulateCandidate(pidx,cards);
        let team=sim.winner!==-1 && sim.winner%2===pidx%2;
        let points=cards.reduce((s,c)=>s+c.score,0);
        let table=0;this.played.forEach(p=>(p||[]).forEach(c=>table+=c.score));
        let cost=this.phase3CardOpportunityCost(pidx,cards);
        let score=0;let reasons=[];
        if (team) {score+=30;reasons.push('本手后我方保持/取得牌权 +30');}
        else {score-=24;reasons.push('本手后仍由敌方领先 -24');}
        if (!curTeam && team) {score+=28;reasons.push('从敌方手中抢回牌权 +28');}
        if (team && sim.secure) {score+=32;reasons.push('后手公开信息下已封口 +32');}
        else if (team) {score-=sim.threats*10;reasons.push(`仍有${sim.threats}条反超通道`);}
        if (curTeam && !curSecurity.secure && team && sim.threats<curSecurity.threats) {score+=22;reasons.push('替对家加固牌权 +22');}
        if (team && sim.secure && points>0) {score+=points*1.8;reasons.push(`安全投分${points}分 +${(points*1.8).toFixed(1)}`);}
        if (!team && points>0) {score-=points*2.1;reasons.push(`敌方可能收走${points}分 -${(points*2.1).toFixed(1)}`);}
        if (table>0 && !curTeam && team) score+=Math.min(24,table*1.1);
        score-=cost*0.72;
        reasons.push(`牌力机会成本 -${(cost*0.72).toFixed(1)}`);
        // 比“还有几家可能压过”更细：同样一名后手，可能性大小不同。
        if(team) score-=sim.risk*(35+table*2+points*2);
        const hand=this.hands[pidx], last=hand.length===cards.length;
        const winningNow=team && !curTeam;
        if(!last&&!team&&cards.some(c=>c.rankIdx>=13)) {score-=90;reasons.push('王不能压过已出的同级王／完整牌型，保留王用于后续接手 -90');}
        for(const pair of this.getPairs(hand.filter(c=>c.isTrump))) {
            if(pair.filter(c=>cards.includes(c)).length===1 && !last) {
                score-=25; reasons.push('拆主对子会失去后续毙对子能力 -25');
            }
        }
        if(last) { score+=team?150:-150; reasons.push('最后一墩优先争底，不再为以后节省大牌'); }
        if(!last && winningNow && table===0 && cards.some(c=>c.rankIdx>=13)
            && !hand.some(c=>!c.isTrump && !cards.includes(c) && this.countPossibleHigherSingles(pidx,c)===0)) score-=115;
        if(!last && winningNow && table===0 && this.getPairs(hand.filter(c=>c.isTrump)).some(p=>p.filter(c=>cards.includes(c)).length===1)
            && !hand.some(c=>!c.isTrump && !cards.includes(c) && this.countPossibleHigherSingles(pidx,c)===0)) score-=90;
        return {score,reasons,sim,cost,points};
    }

    phase7FeedRiskLimit() {
        const lead=this.played[this.firstPlayerOfRound]||[];
        // A successfully accepted mixed throw already excludes same-suit counters.
        return lead.length>=3 && this.phase4IsComplex(lead) && this.getPairs(lead).length ? 0.28 : 0.12;
    }

    phase3ChooseSafePartnerFeed(pidx,candidates) {
        const now=this.phase3CurrentWinnerSecurity(pidx);
        if(now.winner<0 || now.winner%2!==pidx%2 || now.risk>this.phase7FeedRiskLimit()) return null;
        const safe=candidates.map(x=>({...x,sim:this.phase3SimulateCandidate(pidx,x.cards),
            pts:x.cards.reduce((n,c)=>n+c.score,0),cost:this.phase3CardOpportunityCost(pidx,x.cards)}))
            .filter(x=>x.sim.winner>=0&&x.sim.winner%2===pidx%2&&x.sim.risk<=this.phase7FeedRiskLimit());
        safe.sort((a,b)=>b.pts-a.pts||a.cost-b.cost);
        const b=safe[0];if(!b || b.pts<=0)return null;
        return {cards:b.cards,kind:now.secure?'对家稳赢安全投分':'对家高把握墩及时给分',score:b.pts*20-b.cost,
            reasons:[now.secure?'公开信息已排除反超':`反超风险估计${(now.risk*100).toFixed(1)}%，无需等到绝对安全才给分`,
                `合法跟牌范围内送出${b.pts}分，避免分牌留到后面被抓`, '仍按对子、拖拉机的强制跟牌规则选择']};
    }

    phase3ChooseFollowMove(pidx) {
        let candidates=this.phase3GenerateFollowCandidates(pidx);
        if (!candidates.length) return null;
        let protect=this.phase3ChoosePartnerProtection(pidx,candidates);
        if (protect) return {...protect,top:[]};
        // Phase 3.1：成功复杂甩牌不能继续沿用“必须100% secure才投分”的老规则。
        // 甩牌成功本身已经提供了很强的同门控制信息；只需继续评估后手整组主牌反毙概率。
        
        let feed=this.phase3ChooseSafePartnerFeed(pidx,candidates);
        if (feed) return {...feed,top:[]};
        let forced=this.phase3ChooseMandatoryEnemyRuff(pidx,candidates);
        if (forced) return {...forced,top:[]};
        const cur=this.getWinner(),pending=this.phase3PendingOpponents(pidx);
        if(cur>=0&&cur%2!==pidx%2&&pending.length&&this.hands[pidx].length>(this.played[this.firstPlayerOfRound]||[]).length) {
            const ducks=candidates.filter(x=>x.cards.every(c=>c.score===0)&&this.phase3SimulateCandidate(pidx,x.cards).winner!==pidx);
            if(ducks.length) {
                const tablePoints=this.played.flat().reduce((n,c)=>n+c.score,0);
                const filtered=candidates.filter(x=>{
                    const sim=this.phase3SimulateCandidate(pidx,x.cards);
                    if(sim.winner!==pidx||sim.risk<=0.15||x.cards.every(c=>c.score===0))return true;
                    const points=x.cards.reduce((n,c)=>n+c.score,0);
                    // Allow a reasoned fight for substantial table points; do not cash KK merely to beat a Q temporarily.
                    return tablePoints>=20 && tablePoints*(1-sim.risk)>points*sim.risk+8;
                });
                if(filtered.length)candidates=filtered;
            }
        }
        let scored=candidates.map(x=>({...x,...this.phase3ScoreFollowCandidate(pidx,x.cards)})).sort((a,b)=>b.score-a.score);
        let best=scored[0];
        return {cards:best.cards,kind:'V9 合法跟牌与牌权风险评估',score:best.score,reasons:best.reasons,
            top:scored.slice(0,5).map(x=>({cards:x.cards,score:x.score,tag:x.tag}))};
    }

    phase3EvaluatePointGroupLead(pidx,cards) {
        let pts=cards.reduce((s,c)=>s+c.score,0);
        if (pts<=0 || cards.some(c=>c.isTrump)) return {adjust:0,unsafe:false,reasons:[]};
        let suit=cards[0].suit;
        let opps=[(pidx+1)%4,(pidx+3)%4];
        let ruffRisk=opps.some(o=>this.voidMap[o][suit]&&this.phase3SeatMayHaveTrump(o,pidx));
        let higher;
        if (this.isAKKSisterCombo(cards)) {
            let kp=this.getPairs(cards).find(p=>p[0].rankIdx===11);
            // A本身无更大单张；AKK是否安全主要取决于KK是否仍有更大对子结构以及是否会被主毙。
            higher=kp?this.countPossibleHigherPairTypes(pidx,kp):99;
        } else higher=this.phase3CountHigherStructures(pidx,cards);
        let controlled=higher===0 && !ruffRisk;
        if (controlled) return {adjust:12+Math.min(12,pts*0.4),unsafe:false,reasons:['成组分牌已建立公开控制']};
        let penalty=20+pts*0.9+Math.min(18,higher*4)+(ruffRisk?18:0);
        return {adjust:-penalty,unsafe:true,reasons:[`成组分牌未受保护：${pts}分暴露，仍有更大结构/毙牌风险 -${penalty.toFixed(1)}`]};
    }

    // ===== 【修复6】让电脑学会甩牌 =====================================
    // 80分里甩牌是核心战术（尤其闲家：一次把某门的绝对大牌全部甩出，
    // 逼庄家垫牌吐分、打乱布局）。原版电脑被 phase3IsSafeLeadShape 硬性
    // 挡死，25张牌里握着 ♥A♥A♥K♥K 也只会一张一张挤，非常容易被毙。
    //
    // 安全性证明（不偷看别人的暗牌）：
    // 只有当“这门花色里、公开信息判定为未知的牌中，没有任何一张比我这张大”
    // 时，才把这张牌放进甩牌集合。未知区 = 别人手牌 + 底牌，是三家手牌的超集。
    // 因此集合里每一张单牌、每一个对子、每一段拖拉机都不可能被压过，
    // 裁判层的甩牌校验必然通过，绝不会触发罚分。
    phase3SuitHigherUnknown(publicState, suit, card) {
        let n=0;
        for (let r=0;r<13;r++) {
            let info=this.getTypeInfo(suit,r);
            if (info.isTrump || info.weight<=card.weight) continue;
            n += publicState.unknownByType.get(this.cardTypeKey(suit,r))||0;
        }
        return n;
    }

    phase3IsProvablySafeThrow(pidx,cards,publicState=null) {
        if(!cards || cards.length<2 || cards.some(c=>c.isTrump || c.suit!==cards[0].suit)) return false;
        const pairs=this.getPairs(cards), tractors=this.getAllTractors(cards);
        const paired=new Set(pairs.flat().map(c=>c.id));
        const inTractor=new Set(tractors.flat(2).map(c=>c.id));
        return cards.filter(c=>!paired.has(c.id)).every(c=>this.countPossibleHigherSingles(pidx,c)===0)
            && pairs.filter(p=>!inTractor.has(p[0].id)).every(p=>this.countPossibleHigherPairTypes(pidx,p)===0)
            && tractors.every(t=>this.phase3CountHigherTractorWindows(pidx,t.flat())===0);
        // 这里只证明“甩牌成立”。被主牌毙的风险必须另外评估，不能混为一谈。
    }

    phase3SafeThrowCandidates(pidx) {
        let out=[];
        for(let suit=0;suit<4;suit++) {
            const mine=this.hands[pidx].filter(c=>!c.isTrump && c.suit===suit);
            const pairs=this.getPairs(mine), paired=new Set(pairs.flat().map(c=>c.id));
            let safe=pairs.filter(p=>this.countPossibleHigherPairTypes(pidx,p)===0).flat();
            safe.push(...mine.filter(c=>!paired.has(c.id) && this.countPossibleHigherSingles(pidx,c)===0));
            for(const t of this.getAllTractors(mine)) if(this.phase3CountHigherTractorWindows(pidx,t.flat())===0) safe.push(...t.flat());
            safe=[...new Map(safe.map(c=>[c.id,c])).values()];
            if(safe.length>1 && this.phase3IsProvablySafeThrow(pidx,safe)) out.push(safe);
        }
        return out;
    }

    phase3IsSafeLeadShape(pidx,cards) {
        if (!cards || !cards.length) return false;
        if (cards.length===1) return true;
        if (cards.length===2 && this.getPairs(cards).length===1) return true;
        if (this.isPureTractor(cards)) return true;
        if (this.isAKKSisterCombo(cards)) {
            let kk=this.getPairs(cards).find(p=>p[0].rankIdx===11);
            return !!kk && this.countPossibleHigherPairTypes(pidx,kk)===0;
        }
        // 【修复6】公开信息可证明必胜的甩牌，允许首发。
        if (this.phase3IsProvablySafeThrow(pidx,cards)) return true;
        return false; // 其余复杂甩牌仍然不赌。
    }

    phase3ChooseLeadMove(pidx) {
        const hand=this.hands[pidx], ps=this.buildPublicState(pidx), partner=(pidx+2)%4;
        const dealerTeam=pidx%2===this.dealer%2;
        const role=pidx===this.dealer?'庄家':dealerTeam?'庄家队友':'闲家';
        const trumps=hand.filter(c=>c.isTrump), trumpPairs=this.getPairs(trumps);
        const off=hand.filter(c=>!c.isTrump);
        const cashout=this.getOffSuitCashoutSummary(pidx);
        const candidates=this.generateLeadCandidates(pidx,[]).filter(x=>this.phase3IsSafeLeadShape(pidx,x.cards));
        const ready=candidates.filter(x=>!x.cards[0].isTrump && this.phase4LeadControl(pidx,x.cards).higher===0 && this.phase4LeadControl(pidx,x.cards).chance>=0.73);
        const enemyHasTrump=[(pidx+1)%4,(pidx+3)%4].some(o=>this.phase3SeatMayHaveTrump(o,pidx));
        const reserve=this.getBottomCutReservePair(pidx,ps);
        let scored=candidates.map(x=>{
            const cards=x.cards, c=cards[0], control=this.phase4LeadControl(pidx,cards);
            const points=cards.reduce((n,c)=>n+c.score,0), pairs=this.getPairs(cards);
            const left=hand.filter(c=>!cards.includes(c));
            const safety=this.phase5LeadSafety(pidx,cards,control), sisters=safety.sisters;
            let score=control.chance*40+points*(control.chance*2-1)*1.4;
            let reasons=[`${role}：${dealerTeam?'跑分并保底':'抓分并争取抠底'}`];
            if(c.isTrump) {
                const ownStrength=trumps.filter(c=>c.weight>=700).length;
                const enemies=[(pidx+1)%4,(pidx+3)%4].filter(o=>this.phase3SeatMayHaveTrump(o,pidx));
                const enemyUpper=Math.max(0,...enemies.map(o=>Math.min(this.hands[o].length,ps.unknownTrump)));
                const strong=trumps.length>=8 && ownStrength>=3 && control.chance>=0.7;
                const canFinishDraw=enemyHasTrump && control.higher===0 && enemyUpper<=cards.length;
                const payoff=cashout.controlledCount>=3 || cashout.exclusiveSuits.length>0;
                const useful=off.length===0 || (enemyHasTrump && payoff && (canFinishDraw || (strong && !ready.length))) || (sisters && !ready.length && control.chance>=0.68);
                const remainingPairs=this.getPairs(left.filter(c=>c.isTrump)).length;
                let ruffAssets=false;
                for(let suit=0;suit<4;suit++) if(suit!==this.trumpSuit) {
                    const count=off.filter(c=>c.suit===suit).length;
                    if(count<=1 && this.phase3TypeRecordsForGroup(pidx,suit).some(r=>r.remain===2)) ruffAssets=true;
                }
                if(useful) {score+=off.length===0?15:35; reasons.push(off.length===0?'手里已没有副牌，须在主牌中选择控权路线':sisters?'姊妹对趁完整时主动领出，避免跟牌时被拆散':canFinishDraw?'公开主牌余量允许本手清主，随后兑现副牌':'主牌强且有后续副牌收益，可以有目的地清主');}
                else {score-=65; reasons.push('缺少主牌优势或清主后的收益，避免无目的钓主');}
                if(pairs.length && off.length) {
                    const loseLast=trumpPairs.length>0 && remainingPairs===0;
                    if(loseLast && !canFinishDraw && (!sisters || ready.length)) {score-=ruffAssets?68:38; reasons.push('会用掉最后的主对子，失去毙副牌对子的能力');}
                    if(!useful) score-=20;
                    if(this.voidMap[partner][4]) {score-=16;reasons.push('对家已断主，钓主会迫使队友垫牌');}
                }
                if(ready.length && !canFinishDraw && off.length) {score-=70;reasons.push('手里副牌大牌仍有兑现窗口，先跑副牌');}
                if(!enemyHasTrump && off.length) {score-=70;reasons.push('对手已无主，不必继续消耗自己的主控制');}
                const previous=(this.trickHistory||[]).slice(-1)[0];
                const partnerGaveNoPoints=previous&&previous.leadTrump&&previous.winner===pidx&&(previous.plays[partner]||[]).every(c=>c.score===0);
                if(cards.length===1&&c.rankIdx>=13&&trumps.length>3&&!canFinishDraw&&left.some(k=>k.isTrump&&k.weight>=700)&&partnerGaveNoPoints) {
                    score-=18;reasons.push('对家上一主牌墩未给分是弱信号，暂留王接手；不能据此断言对家无分牌');
                }
                score-=this.phase3CardOpportunityCost(pidx,cards)*0.25;
            } else {
                const suitCount=off.filter(k=>k.suit===c.suit).length;
                const knownRuff=[(pidx+1)%4,(pidx+3)%4].some(o=>this.voidMap[o][c.suit] && this.phase4SeatCanSupply(o,pidx,cards,4));
                if(control.higher===0 && control.chance>=0.73 && !knownRuff) {
                    const singles=cards.filter(k=>!pairs.flat().includes(k));
                    const exposed=singles.length>0?8:0;
                    score+=24+cards.length*4+points*0.4+exposed;
                    reasons.push('副牌大牌趁对手尚能跟牌时兑现，拖延会增加被毙风险');
                    if(this.phase4IsComplex(cards)) {score+=10;reasons.push('按单张、对子、拖拉机分别证明可甩，整组兑现');}
                }
                if(knownRuff) {score-=75+points*2;reasons.push('已断门对手仍可能凑出匹配主牌，避免送毙');}
                const shortRisk=Math.max(0,...[(pidx+1)%4,(pidx+3)%4].map(o=>this.phase4SeatCanSupply(o,pidx,cards,4)?Math.min(this.phase7ShortSuitSignal(o,c.suit),this.phase3EstimateSeatVoidProbability(o,c.suit,pidx)):0));
                if(shortRisk) {score-=shortRisk*(65+points*3);reasons.push('对手最近跟此门丢出K/10，可能已短门或断门，避免立即再送同门（推测）');}
                if(suitCount===cards.length) {score+=control.chance>=0.6?9:3;reasons.push('出完可断此门，但清门不能压过保分');}
                if(this.voidMap[partner][c.suit] && this.phase4SeatCanSupply(partner,pidx,cards,4)) {
                    score+=knownRuff?0:9;reasons.push('对家已断此门，存在主牌接手通道（不保证）');
                }
                if(points && control.higher>0 && control.chance<0.7) score-=points*1.2;
            }
            // 结构受损只算真正拆掉的半对；整对兑现不等于拆对。
            for(const p of this.getPairs(hand)) if(p.filter(k=>cards.includes(k)).length===1) {
                score-=p[0].isTrump?35:20; reasons.push(p[0].isTrump?'避免拆主对子':'避免把副牌对子拆散');
            }
            for(const tractor of this.getAllTractors(hand)) {
                const flat=tractor.flat(), used=flat.filter(c=>cards.includes(c)).length;
                if(used>0 && used<flat.length) {score-=55;reasons.push('避免提前拆掉完整姊妹对 -55');}
            }
            if(sisters && (!c.isTrump || !ready.length) && control.chance>=0.68 && !safety.knownRuff) {
                score+=65+cards.length*3;reasons.push('完整姊妹对优先兑现，避免拿不到牌权或被迫拆掉');
            }
            if(safety.unsafePoint) {score-=180+points*3;reasons.push('分牌没有可靠保护，不能仅凭估计胜率主动送出');}
            if(hand.length<=8) score+=control.chance*12;
            if(reserve && cards.some(c=>reserve.pair.includes(c)) && left.length) {score-=32;reasons.push('有后续控权路线，可保留可靠主对子争最后一墩');}
            if(!left.length) {score+=control.chance*35;reasons.push('最后一手优先争牌权');}
            // 门槛每40分递进；过80后仍需关注120/160，而不是一直“接近80”。
            const target=this.score<80?80:(Math.floor(this.score/40)+1)*40;
            if(target-this.score<=20) score+=control.chance*(dealerTeam?10:8);
            return {...x,score,reasons,control,safety};
        });
        // 只要有其他可出牌，硬性排除无保护的分牌，尤其开局单K/单10/单5。
        const protectedPool=scored.filter(x=>!x.safety.unsafePoint);
        const avoidedPoints=protectedPool.length<scored.length && protectedPool.length>0;
        if(protectedPool.length) scored=protectedPool;
        // 副牌强姊妹对优先；主姊妹对须先权衡副牌兑现窗口及清主收益。
        const sistersPool=scored.filter(x=>!x.cards[0].isTrump && x.safety.sisters && x.control.chance>=0.68 && !x.safety.knownRuff);
        if(sistersPool.length) scored=sistersPool;
        scored.sort((a,b)=>b.score-a.score);
        const best=scored[0];
        if(best) {
            best.reasons.unshift(this.phase5MemoryReason(pidx,best.cards));
            if(avoidedPoints) best.reasons.push('已排除无保护分牌：外面的大牌/匹配主牌未排除时不主动送分');
            if(!protectedPool.length) best.reasons.push('仅余风险分牌可出，按损失与牌权选择，无法保证保住全部分');
        }
        return best?{cards:best.cards,kind:'V9 首发：副牌窗口、结构保留与断门推理',score:best.score,reasons:best.reasons,
            top:scored.slice(0,5).map(x=>({cards:x.cards,score:x.score,tag:x.tag}))}:null;
    }

    choosePhase3Move(pidx) {
        if (!this.aiSettings || !this.aiSettings.phase3Core) return null;
        let first=this.played[this.firstPlayerOfRound];
        let d=this.phase7WithDecisionCache(()=>(!first||first.length===0)?this.phase3ChooseLeadMove(pidx):this.phase3ChooseFollowMove(pidx));
        if (!d || !d.cards || !d.cards.length) return null;
        // 跟牌必须再次通过唯一规则检查；首发只允许Phase3认定的简单/确定安全结构。
        if (first && first.length>0 && !this.isValidPlay(pidx,d.cards,true)) return null;
        return d;
    }

    // V4：一处定义完整牌型匹配。混合甩牌里的拖拉机不能用散对子冒充。
    // V5：只记已公开落桌的实体牌，整局累计；换局清空，候选试算不写入。
    phase5RememberPlay(seat,cards) {
        for(const c of cards) if(!this.publicPlayLedger.some(x=>x.id===c.id)) {
            this.publicPlayLedger.push({seat,id:c.id,suit:c.suit,rankIdx:c.rankIdx,
                group:c.isTrump?4:c.suit,label:c.getLabel()});
        }
    }

    phase5SuitBounds(pidx) {
        const ps=this.buildPublicState(pidx);
        const totals=[0,1,2,3].map(s=>ps.unknownBySuit[s]).concat(ps.unknownTrump);
        const seats=[0,1,2,3].filter(s=>s!==pidx);
        const buckets=seats.map(seat=>({seat,n:this.hands[seat].length,
            lo:[0,0,0,0,0],hi:totals.map((n,g)=>this.voidMap[seat][g]?0:Math.min(n,this.hands[seat].length))}));
        // 非庄家不知道底牌：剩余未知牌进入独立底牌桶，不能强塞给某个玩家。
        const hiddenBottom=Math.max(0,ps.unknownTotal-buckets.reduce((n,b)=>n+b.n,0));
        if(hiddenBottom) buckets.push({seat:-1,n:hiddenBottom,lo:[0,0,0,0,0],hi:totals.map(n=>Math.min(n,hiddenBottom))});
        // 由“每家剩余张数 + 每门全桌余量 + 公开断门”传播上下界。
        // 例如某家只可能剩主和黑桃，黑桃全桌最多一张，则其余必须是主。
        for(let pass=0;pass<12;pass++) {
            let changed=false;
            for(const b of buckets) for(let g=0;g<5;g++) {
                const rowLo=b.lo.reduce((n,v,k)=>n+(k===g?0:v),0), rowHi=b.hi.reduce((n,v,k)=>n+(k===g?0:v),0);
                const colLo=buckets.reduce((n,x)=>n+(x===b?0:x.lo[g]),0), colHi=buckets.reduce((n,x)=>n+(x===b?0:x.hi[g]),0);
                const lo=Math.max(b.lo[g],b.n-rowHi,totals[g]-colHi,0);
                const hi=Math.min(b.hi[g],b.n-rowLo,totals[g]-colLo);
                // 不一致的外部测试/导入状态不产生虚假的确定结论。
                if(lo>hi) return {consistent:false,totals,seats:seats.map(seat=>({seat,n:this.hands[seat].length,
                    lo:[0,0,0,0,0],hi:totals.map((n,g)=>this.voidMap[seat][g]?0:Math.min(n,this.hands[seat].length))}))};
                if(lo!==b.lo[g]||hi!==b.hi[g]) changed=true;
                b.lo[g]=lo;b.hi[g]=hi;
            }
            if(!changed) break;
        }
        return {consistent:true,totals,seats:buckets.filter(b=>b.seat>=0)};
    }

    phase5HigherEnemyStructures(pidx,cards) {
        const higher=this.phase3CountHigherStructures(pidx,cards);
        if(higher===0) return 0;
        const group=cards[0].isTrump?4:cards[0].suit, bounds=this.phase5SuitBounds(pidx);
        // 只有未知大牌能落在对手手中、且其仍可具备相应结构时，才计为敌方威胁。
        const possible=[(pidx+1)%4,(pidx+3)%4].some(seat=>{
            const b=bounds.seats.find(x=>x.seat===seat);
            return b.hi[group]>=cards.length && this.phase3PendingCanBeatStructure(seat,pidx,cards,group,higher);
        });
        return possible?higher:0;
    }

    phase5LeadSafety(pidx,cards,control) {
        const points=cards.reduce((n,c)=>n+c.score,0), c=cards[0];
        const sisters=this.isPureTractor(cards);
        const knownRuff=!c.isTrump && [(pidx+1)%4,(pidx+3)%4].some(o=>this.voidMap[o][c.suit]&&this.phase4SeatCanSupply(o,pidx,cards,4));
        // 完整且有较强控制力的连对具备结构保护；单K、单10和裸分对不能靠“估计胜率”放行。
        const structureProtected=sisters && control.chance>=0.68 && !knownRuff;
        const unsafePoint=points>0 && (knownRuff || (control.higher>0 && !structureProtected));
        return {unsafePoint,sisters,knownRuff,structureProtected};
    }

    phase5MemoryReason(pidx,cards) {
        const group=cards[0].isTrump?4:cards[0].suit;
        const ps=this.buildPublicState(pidx);
        const played=this.playHistory.filter(c=>(c.isTrump?4:c.suit)===group).length;
        const unseen=group===4?ps.unknownTrump:ps.unknownBySuit[group];
        const bigger=this.phase5HigherEnemyStructures(pidx,cards);
        return `记牌：${group===4?'主牌':SUITS[group]}已公开${played}张，扣除自己手牌${pidx===this.dealer?'和底牌':''}后仍未知${unseen}张；${bigger===0?'已排除敌方更大同结构':`仍有${bigger}种/张更大同结构可能`}`;
    }

    phase5RenderMemory(open=false) {
        if(!this.publicPlayLedger.length) return '';
        let body='';
        for(let seat=0;seat<4;seat++) {
            const groups=[];
            for(let g=0;g<5;g++) {
                const cards=this.publicPlayLedger.filter(x=>x.seat===seat&&x.group===g);
                const counts=new Map();cards.forEach(c=>counts.set(c.label,(counts.get(c.label)||0)+1));
                const labels=[...counts].map(([label,n])=>`${label}${n>1?'×'+n:''}`).join(' ');
                const absent=this.voidMap[seat][g]?'；已断门':this.inferenceState.confirmedNoPair[seat][g]?'；已无对子':'';
                if(cards.length||absent) groups.push(`<div>${g===4?'主牌':SUITS[g]}：已出${cards.length}张 ${labels}${absent}</div>`);
            }
            body+=`<div style="margin-top:8px"><b>${NAMES[seat]}</b>${groups.join('')}</div>`;
        }
        let remaining='';
        for(let g=0;g<5;g++) {
            const rows=this.phase3TypeRecordsForGroup(0,g).filter(r=>r.remain>0).sort((a,b)=>b.weight-a.weight);
            const labels=rows.map(r=>`${r.rankIdx===14?'大王':r.rankIdx===13?'小王':SUITS[r.suit]+RANKS[r.rankIdx]}×${r.remain}`).join(' ');
            remaining+=`<div>${g===4?'主牌':SUITS[g]}：${labels||'已无未知牌'}</div>`;
        }
        return `<details ${open?'open':''} style="margin-bottom:12px"><summary>逐人公开记牌（本局累计）</summary>${body}<div style="margin-top:12px"><b>你尚不能确定位置的余牌</b><div>已扣除你的手牌及公开牌；若你坐庄，也扣除你埋的底牌。</div>${remaining}</div><div style="margin-top:8px">未公开的牌只推算可能范围，不知道具体在哪家。</div></details>`;
    }

    phase4IsComplex(cards) {
        return cards.length>1 && !(cards.length===2 && this.getPairs(cards).length===1) && !this.isPureTractor(cards);
    }

    phase4StructureCores(pool,lead,limit=80) {
        const tractors=this.getAllTractors(lead).map(t=>t.length).sort((a,b)=>b-a);
        const pairCount=this.getPairs(lead).length;
        const stand=pairCount-tractors.reduce((n,x)=>n+x,0);
        const out=[];
        const walk=(rest,idx,base)=>{
            if(out.length>=limit) return;
            if(idx<tractors.length) {
                for(const w of this.getTractorWindows(rest,tractors[idx])) {
                    const flat=w.flat(); walk(rest.filter(c=>!flat.includes(c)),idx+1,[...base,...flat]);
                    if(out.length>=limit) break;
                }
            } else {
                for(const pc of this.phase3ChooseCombos(this.getPairs(rest),stand,limit)) {
                    out.push([...base,...pc.flat()]); if(out.length>=limit) break;
                }
            }
        };
        walk(pool,0,[]);
        return out;
    }

    phase4MatchesStructure(cards,lead) {
        return cards.length>=lead.length && this.phase4StructureCores(cards,lead,1).length>0;
    }

    phase4SeatCanSupply(seat,pidx,shape,group) {
        if(!shape.length || this.voidMap[seat][group] || this.hands[seat].length<shape.length) return false;
        if(group===4 && !this.phase3SeatMayHaveTrump(seat,pidx)) return false;
        const bounds=this.phase5SuitBounds(pidx).seats.find(x=>x.seat===seat);
        if(bounds && bounds.hi[group]<shape.length) return false;
        const pairs=this.getPairs(shape).length;
        if(pairs && this.inferenceState.confirmedNoPair[seat][group]) return false;
        for(const t of this.getAllTractors(shape)) {
            for(let n=2;n<=t.length;n++) if(this.inferenceState.confirmedNoTractor[seat][`${group}:${n}`]) return false;
        }
        const pool=[];
        for(const r of this.phase3TypeRecordsForGroup(pidx,group)) {
            for(let n=0;n<r.remain;n++) pool.push({id:`u:${r.suit}:${r.rankIdx}:${n}`,suit:r.suit,rankIdx:r.rankIdx,
                weight:r.weight,tractorId:r.tid,isTrump:group===4,score:0});
        }
        return this.phase4MatchesStructure(pool,shape);
    }

    phase4LeadControl(pidx,cards) {
        const c=cards[0], group=c.isTrump?4:c.suit;
        let higher=this.phase5HigherEnemyStructures(pidx,cards);
        if(this.phase4IsComplex(cards) && this.phase3IsProvablySafeThrow(pidx,cards)) higher=0;
        const pairCount=this.getPairs(cards).length;
        // 启发式风险，只用于排序，不作为“已证实”的事实写入记牌器。
        let chance=1-Math.min(0.8,higher*(cards.length===1?0.065:0.12));
        let survive=1;
        for(const opp of [(pidx+1)%4,(pidx+3)%4]) {
            if(c.isTrump) continue;
            if(!this.phase4SeatCanSupply(opp,pidx,cards,4)) continue;
            const pVoid=this.phase3EstimateSeatVoidProbability(opp,c.suit,pidx);
            const enough=this.phase7StructureProbability(opp,pidx,cards,4,-Infinity,c.suit);
            // 已确认断门时不能靠平均主张数掩盖风险。
            const ruff=this.voidMap[opp][c.suit]?Math.max(0.65,enough):pVoid*enough;
            survive*=1-Math.min(0.98,ruff);
        }
        chance*=survive;
        return {chance:Math.max(0.01,Math.min(0.99,chance)),higher,ruffRisk:1-survive,pairCount,group};
    }

    phase3LowestCostLegalMove(pidx) {
        let first=this.played[this.firstPlayerOfRound];
        if (!first || first.length===0) {
            let h=[...(this.hands[pidx]||[])].sort((a,b)=>this.phase3CardOpportunityCost(pidx,[a])-this.phase3CardOpportunityCost(pidx,[b]));
            return h.length?[h[0]]:[];
        }
        let c=this.phase3GenerateFollowCandidates(pidx);
        c.sort((a,b)=>this.phase3CardOpportunityCost(pidx,a.cards)-this.phase3CardOpportunityCost(pidx,b.cards));
        return c.length?c[0].cards:[];
    }

    // Phase 2.6：同门副牌 AKK 视为“姐妹对”候选。
    // 这里仅生成候选；最终是否能甩成功，仍交给裁判层 aiValidateThrow 判定。
    isAKKSisterCombo(cards) {
        if (!cards || cards.length !== 3) return false;
        if (cards.some(c => c.isTrump)) return false;
        let suit = cards[0].suit;
        if (!cards.every(c => c.suit === suit)) return false;
        let ranks = cards.map(c => c.rankIdx).sort((a,b)=>a-b);
        return ranks[0] === 11 && ranks[1] === 11 && ranks[2] === 12; // K,K,A
    }

    getAKKSisterCombos(pidx) {
        let hand = this.hands[pidx] || [];
        let combos = [];
        for (let suit=0; suit<4; suit++) {
            let cards = hand.filter(c => !c.isTrump && c.suit === suit);
            let aces = cards.filter(c => c.rankIdx === 12);
            let kings = cards.filter(c => c.rankIdx === 11);
            if (aces.length >= 1 && kings.length >= 2) {
                // 两副牌里K最多两张；A若有两张，只需挑一张与KK组成AKK，另一张留作控制牌。
                combos.push([aces[0], kings[0], kings[1]]);
            }
        }
        return combos;
    }

    // 当前这一墩，除自己外的三家是否都已经实际跟出了领出副牌花色。
    // 只有“本墩已经看见三家都跟牌”才叫确认，历史上曾经跟过不算。
    allOtherPlayersConfirmedInLeadSuit(pidx, leadSuit) {
        if (this.firstPlayerOfRound === -1) return false;
        for (let seat=0; seat<4; seat++) {
            if (seat === pidx) continue;
            let played = this.played[seat] || [];
            if (played.length === 0) return false;
            let hasLeadSuit = played.some(c => !c.isTrump && c.suit === leadSuit);
            if (!hasLeadSuit) return false;
        }
        return true;
    }

    // “只出够大的牌”：如果最小主已经足够，就绝不为了保险直接跳到级牌/王。
    // 优先级：普通小主 < 级牌 < 小王 < 大王；同档内尽量不拆对子，再取最小权重。
    chooseMinimumSufficientTrump(pidx, trumps, maxW) {
        if (!trumps || trumps.length === 0) return null;
        let pairIds = new Set(this.getPairs(trumps).flat().map(c=>c.id));
        let win = trumps.filter(c => (c.weight + 10000) > maxW);
        if (win.length === 0) return null;
        let tier = c => {
            if (c.rankIdx === 14) return 3;
            if (c.rankIdx === 13) return 2;
            if (c.weight >= 700) return 1;
            return 0;
        };
        win.sort((a,b) => {
            if (tier(a) !== tier(b)) return tier(a) - tier(b);
            let ap = pairIds.has(a.id) ? 1 : 0;
            let bp = pairIds.has(b.id) ? 1 : 0;
            if (ap !== bp) return ap - bp;
            if (a.score !== b.score) return a.score - b.score;
            return a.weight - b.weight;
        });
        return win[0];
    }

    // 闲家残局抠底：优先保留一个最有希望赢最后一墩的对子到最后。
    // 只影响“主动首发”，被迫跟牌时仍必须遵守牌型规则。
    getBottomCutReservePair(pidx,publicState=null) {
        const hand=this.hands[pidx]||[];
        if(hand.length>6 || hand.length<2) return null;
        // 双方都需要末墩控制；只有可靠主对子、且剩余牌能继续控权才留。
        const pairs=this.getPairs(hand.filter(c=>c.isTrump)).filter(p=>this.countPossibleHigherPairTypes(pidx,p)===0);
        for(const pair of pairs.sort((a,b)=>b[0].weight-a[0].weight)) {
            const rest=hand.filter(c=>!pair.includes(c));
            const restPairs=this.getPairs(rest), paired=new Set(restPairs.flat().map(c=>c.id));
            if(restPairs.every(p=>this.phase4LeadControl(pidx,p).chance>=0.85)
                && rest.filter(c=>!paired.has(c.id)).every(c=>this.phase4LeadControl(pidx,[c]).chance>=0.85)) return {pair};
        }
        return null;
    }

    sameCardSet(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        let aa = a.map(c=>c.id).sort((x,y)=>x-y).join(',');
        let bb = b.map(c=>c.id).sort((x,y)=>x-y).join(',');
        return aa === bb;
    }

    generateLeadCandidates(pidx, legacyChoice=[]) {
        let hand = this.hands[pidx];
        let candidates = [];
        let seen = new Set();
        let add = (cards, tag) => {
            if (!cards || cards.length === 0) return;
            let ids = cards.map(c=>c.id).sort((a,b)=>a-b).join('-');
            if (seen.has(ids)) return;
            seen.add(ids);
            candidates.push({cards:[...cards], tag});
        };

        add(legacyChoice, '原策略');

        // 单张：同牌型的两张重复牌只留一个候选，减少无意义计算。
        let typeSeen = new Set();
        for (let c of hand) {
            let key = this.cardTypeKey(c.suit, c.rankIdx);
            if (!typeSeen.has(key)) {
                typeSeen.add(key);
                add([c], '单张');
            }
        }

        // 对子。
        for (let p of this.getPairs(hand)) add(p, '对子');

        // Phase 2.6：副牌AKK姐妹对作为一个整体候选，不再只会拆成A或KK单独出。
        for (let combo of this.getAKKSisterCombos(pidx)) add(combo, '姐妹对AKK');

        // 【修复6】公开信息可证明必胜的甩牌候选（同门绝对大牌一次全甩）。
        for (let t of this.phase3SafeThrowCandidates(pidx)) add(t, '安全甩牌');

        // 拖拉机：保留完整拖拉机，同时生成2连对窗口，避免永远一口气打光长拖拉机。
        for (let t of this.getAllTractors(hand)) {
            add(t.flat(), '拖拉机');
            if (t.length > 2) {
                for (let i=0; i<=t.length-2; i++) add(t.slice(i,i+2).flat(), '两连对');
            }
        }

        return candidates;
    }

    // Phase 2.1：主动领出分牌的“保驾护航”判定。
    // 真人策略：5/10/K若不是该门确定大牌，就不能仅凭“也许能赢”主动送出。
    // 至少需要：①自己已经是公开信息下的最大牌；或 ②已确认对家断门且仍可能有主，能安全毙牌接手。
    evaluatePointLeadSafety(pidx, cards, publicState=null, partnerModel=null) {
        publicState = publicState || this.buildPublicState(pidx);
        partnerModel = partnerModel || this.getPartnerModel(pidx);
        if (!cards || cards.length !== 1) return {adjust:0, unsafe:false, reasons:[]};
        let card = cards[0];
        if (card.isTrump || card.score <= 0) return {adjust:0, unsafe:false, reasons:[]};

        let higherUnknown = this.countPossibleHigherSingles(pidx, card);
        let partnerKnownVoid = partnerModel.voidSuits.includes(card.suit);
        let partnerCanRuff = partnerKnownVoid && partnerModel.mayHaveTrump;
        let opponents = [(pidx+1)%4, (pidx+3)%4];
        let opponentMayOverRuff = opponents.some(o => this.voidMap[o][card.suit] && this.phase3SeatMayHaveTrump(o,pidx));
        let escorted = partnerCanRuff && !opponentMayOverRuff;
        let recentlyFollowed = partnerModel.recentFollowedSuits.includes(card.suit) && !partnerKnownVoid;
        let reasons = [];

        if (higherUnknown === 0) {
            // 例如两张A都已公开后再出K：无需对家护航，本身就是顶张。
            return {adjust:14, unsafe:false, higherUnknown, escorted:false, reasons:['分牌已成该门顶张 +14']};
        }
        if (escorted) {
            return {adjust:12, unsafe:false, higherUnknown, escorted:true, reasons:['对家已断门且有主可护分 +12']};
        }

        // 没有保险：未知区仍有更大的同门牌，而且对家也未证实断门。
        // 这类10/K属于“主动暴露分牌”，重罚；未知大牌越多，风险越高。
        let penalty = 18 + card.score * 0.8 + Math.min(14, higherUnknown * 2.5);
        if (recentlyFollowed) penalty += 6;
        reasons.push(`分牌无护航：仍有${higherUnknown}张更大同门未知 -${penalty.toFixed(1)}`);
        if (recentlyFollowed) reasons.push('对家最近刚跟过此门，不能假设已断门 -6');
        return {adjust:-penalty, unsafe:true, higherUnknown, escorted:false, recentlyFollowed, reasons};
    }

    // Phase 2.7：已知对手断门后的主动领牌风险门禁。
    // 如果公开信息已确认任一对手没有这门副牌，而该对手仍“可能有主”（尚未确认断主），
    // 主动再领这门副牌等于把牌送给对手毙。除非没有任何安全替代牌，否则禁止。
    // 这里严格只使用 voidMap（公开跟牌信息），不猜暗牌。
    evaluateKnownOpponentVoidLeadRisk(pidx, cards) {
        let result = {forbidden:false, dangerousOpps:[], suit:-1, reasons:[]};
        if (!cards || cards.length === 0) return result;
        if (cards.some(c => c.isTrump)) return result;
        let suit = cards[0].suit;
        if (!cards.every(c => !c.isTrump && c.suit === suit)) return result;
        result.suit = suit;

        let opponents = [(pidx+1)%4, (pidx+3)%4];
        let dangerous = opponents.filter(o => this.voidMap[o][suit] && this.phase3SeatMayHaveTrump(o,pidx));
        if (dangerous.length === 0) return result;

        result.forbidden = true;
        result.dangerousOpps = dangerous;
        result.reasons.push(`已确认${dangerous.map(o=>NAMES[o]).join('、')}断${SUITS[suit]}且仍可能有主：主动再出此门等于送毙`);
        return result;
    }

    scoreLeadCandidate(pidx, cards, publicState=null, partnerModel=null) {
        publicState = publicState || this.buildPublicState(pidx);
        partnerModel = partnerModel || this.getPartnerModel(pidx);
        let hand = this.hands[pidx];
        let first = cards[0];
        let leadTrump = first.isTrump;
        let pairs = this.getPairs(cards);
        let isPair = cards.length === 2 && pairs.length === 1;
        let isTractor = this.isPureTractor(cards);
        let points = cards.reduce((s,c)=>s+c.score,0);
        let winChance = this.estimateLeadWinChance(pidx, cards, publicState);
        let score = winChance * 34;
        let reasons = [`预计拿牌权 ${(winChance*100).toFixed(0)}%`];

        // 牌型资产：对子/拖拉机比裸单张更难被盖。
        let isAKKSister = this.isAKKSisterCombo(cards);
        if (isPair) { score += 7; reasons.push('对子结构 +7'); }
        if (isTractor) { score += 12 + Math.max(0,pairs.length-2)*2; reasons.push('拖拉机结构 +12'); }
        if (isAKKSister) { score += 20; reasons.push('AKK姐妹对整体出牌，保留牌权并减少拆牌 +20'); }

        // 清门价值。
        if (!leadTrump) {
            let suitCount = hand.filter(c=>!c.isTrump && c.suit===first.suit).length;
            if (suitCount <= cards.length) { score += 11; reasons.push('可直接清门 +11'); }
            else if (suitCount - cards.length <= 1) { score += 6; reasons.push('接近清门 +6'); }

            // 对家已经断这门且可能还有主：出该门具有喂牌/接管协同价值。
            if (partnerModel.voidSuits.includes(first.suit) && partnerModel.mayHaveTrump) {
                let oppRuff = [(pidx+1)%4,(pidx+3)%4].some(o => this.voidMap[o][first.suit] && !this.voidMap[o][4]);
                if (!oppRuff) { score += 10; reasons.push('对家断门可接手 +10'); }
                else { score -= 5; reasons.push('对手也可能毙 -5'); }
            }
        }

        // Phase 2.7：已知有对手断此门且仍可能有主时，主动继续领此门属于“自动送死”。
        // 评分层先重罚，选择层再做硬门禁；只有在所有候选都同样危险时才允许被迫选择。
        let knownVoidLeadRisk = this.evaluateKnownOpponentVoidLeadRisk(pidx, cards);
        let knownVoidLeadForbidden = knownVoidLeadRisk.forbidden;
        if (knownVoidLeadForbidden) {
            score -= 160;
            reasons.push(...knownVoidLeadRisk.reasons.map(r=>`${r} -160`));
        }

        // 分牌风险/收益：高胜率可带分，低胜率不要主动送10/K。
        if (points > 0) {
            let pointValue = points * (winChance - (1-winChance)*1.35) * 0.9;
            score += pointValue;
            reasons.push(`牌面${points}分 ${pointValue>=0?'+':''}${pointValue.toFixed(1)}`);

            // Phase 2.1：把“分牌有没有人保驾护航”作为独立战略条件，而不是只折算进胜率。
            let pointSafety = this.evaluatePointLeadSafety(pidx, cards, publicState, partnerModel);
            score += pointSafety.adjust;
            reasons.push(...pointSafety.reasons);
            var unsafePointLead = pointSafety.unsafe;
        } else {
            var unsafePointLead = false;
        }

        // 单张若拆对子，明确扣分；Phase 1虽尽量避免，但评分层也必须知道这件事。
        if (cards.length === 1) {
            let pairIds = new Set(this.getPairs(hand).flat().map(c=>c.id));
            if (pairIds.has(cards[0].id)) { score -= 13; reasons.push('拆对子 -13'); }
        }

        // 主牌机会成本与团队策略。
        let trumps = hand.filter(c=>c.isTrump);
        let pointlessTrumpFishing = false;
        let trumpFishingPurpose = null;
        if (leadTrump) {
            let strongTrumpCount = trumps.filter(c=>c.weight>=112).length;
            if (trumps.length >= 9 && strongTrumpCount >= 3) { score += 8; reasons.push('主牌较强可控主 +8'); }
            if (trumps.length <= 5 && hand.length > 8) { score -= 9; reasons.push('主牌偏弱宜保留 -9'); }
            if (partnerModel.wantsTrumpControl) { score += 6; reasons.push('响应对家钓主信号 +6'); }
            // 大小王/级牌单张无分也很贵，不应无意义裸出。
            if (cards.length === 1 && cards[0].weight >= 700 && points === 0 && winChance < 0.86) {
                score -= 7; reasons.push('高主机会成本 -7');
            }

            // Phase 2.5：单张钓主必须回答“耗完主以后我拿什么兑现”。
            // 姐妹对/拖拉机本身仍可作为强牌型参与竞争，但不能在其后无目的无限小主。
            trumpFishingPurpose = this.evaluateTrumpFishingPurpose(pidx, cards, publicState);
            if (cards.length === 1) {
                if (trumpFishingPurpose.meaningful) {
                    score += 14;
                    reasons.push(...trumpFishingPurpose.reasons.map(r=>`钓主有目标：${r} +14`));
                } else {
                    score -= 52;
                    pointlessTrumpFishing = true;
                    reasons.push(...trumpFishingPurpose.reasons.map(r=>`无目的钓主：${r} -52`));
                }
            } else if (!trumpFishingPurpose.meaningful && (isPair || isTractor)) {
                score -= 8;
                reasons.push('成组钓主虽有牌型优势，但副牌兑现目标不足 -8');
            }
        }

        // 比分紧迫度：闲家接近80要抢分/控权；庄家看到闲家接近80要更重视牌权。
        let isDealerTeam = (pidx % 2 === this.dealer % 2);
        if (!isDealerTeam && this.score >= 60) {
            score += winChance * 8 + points * 0.18;
            reasons.push('闲家接近80，提高抢分权重');
        } else if (isDealerTeam && this.score >= 60) {
            score += winChance * 10;
            reasons.push('庄家防80，提高控权权重');
        }

        // 残局更重牌权与成组牌。
        if (hand.length <= 8) {
            score += winChance * 10;
            if (isPair || isTractor) score += 5;
            reasons.push('残局提高牌权权重');
        }

        // Phase 2.3：在“主牌姐妹对钓主后”的连续控主阶段，弱副牌不能再被当成普通清废牌。
