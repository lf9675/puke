        hand.forEach(c => { if (!c.isTrump) suitCounts[c.suit]++; });

        let trashSingles = singles.filter(c => !c.isTrump && c.score === 0 && c.rankIdx < 12).sort((a,b) => {
            if (suitCounts[a.suit] !== suitCounts[b.suit]) return suitCounts[a.suit] - suitCounts[b.suit];
            return a.weight - b.weight;
        });
        
        let pointSinglesForAlly = singles.filter(c => !c.isTrump && c.score > 0 && c.rankIdx < 12).sort((a,b)=>b.score-a.score);
        let pointSinglesForOpp = singles.filter(c => !c.isTrump && c.score > 0 && c.rankIdx < 12).sort((a,b) => {
            if (suitCounts[a.suit] !== suitCounts[b.suit]) return suitCounts[a.suit] - suitCounts[b.suit];
            return a.weight - b.weight;
        });
        
        let aces = singles.filter(c => !c.isTrump && c.rankIdx === 12).sort((a,b)=>a.weight-b.weight);
        let trumpSingles = singles.filter(c => c.isTrump && c.rankIdx < 13).sort((a,b)=>a.weight-b.weight);
        let jokers = singles.filter(c => c.rankIdx >= 13).sort((a,b)=>a.weight-b.weight);
        
        let res = [];
        if (allyWinning) {
            // 对家赢着：先投分牌，再垫废牌
            for(let c of pointSinglesForAlly) { if(res.length < neededCount) res.push(c); }
            for(let c of trashSingles) { if(res.length < neededCount) res.push(c); }
        } else {
            // ★修复D：对手赢时严格保护分牌，主牌分牌最后垫
            // 顺序：副牌废牌 → 副牌分牌(5→10→K) → 副牌A → 主牌废牌 → 主牌分牌 → 大小王
            for(let c of trashSingles) { if(res.length < neededCount) res.push(c); }
            // 副牌分牌（非主牌），按分值升序（5分先于10/K）
            let ntPointMin = [...pointSinglesForOpp].filter(c=>!c.isTrump).sort((a,b)=>a.score-b.score);
            for(let c of ntPointMin) { if(res.length < neededCount) res.push(c); }
        }
        for(let c of aces) { if(res.length < neededCount) res.push(c); }
        // 主牌单张：先出无分，再出有分（主牌分牌最珍贵，最后垫）
        let trumpSinglesNoScore = trumpSingles.filter(c=>c.score===0);
        let trumpSinglesScore   = trumpSingles.filter(c=>c.score>0).sort((a,b)=>a.score-b.score);
        for(let c of trumpSinglesNoScore) { if(res.length < neededCount) res.push(c); }
        for(let c of trumpSinglesScore)   { if(res.length < neededCount) res.push(c); }
        for(let c of jokers) { if(res.length < neededCount) res.push(c); }
        
        if (res.length < neededCount) {
            let remain = hand.filter(c => !res.includes(c)).sort((a,b) => {
                if (a.rankIdx >= 12) return 1; 
                if (!a.isTrump && !b.isTrump && suitCounts[a.suit] !== suitCounts[b.suit]) {
                    return suitCounts[a.suit] - suitCounts[b.suit];
                }
                return a.weight - b.weight;
            });
            for(let c of remain) { if(res.length < neededCount && !res.includes(c)) res.push(c); }
        }
        return res;
    }

    executePlay(pidx, cards) {
        if(this.phase!=='PLAYING'||this.turn!==pidx)return;
        this.recorder.safe(()=>this.recorder.start());
        if(!this.isValidPlay(pidx,cards)) {this.recorder.safe(()=>this.recorder.rejected(pidx,cards,'实际出牌未通过规则检查'));return;}
        const requested=[...cards];
        if(pidx!==0 && this.played.every(p=>p.length===0)) cards=this.aiValidateThrow(pidx,cards);
        this.recorder.safe(()=>this.recorder.move(pidx,cards,requested));
        sfx.play();

        if (this.played.every(p => p.length === 0)) {
            this.firstPlayerOfRound = pidx;
            let leadIsTrump = cards[0].isTrump;
            if (cards.length > 0 && leadIsTrump) {
                speakText("钓主！");
                this.showFX("🎣 钓主！");
            }
            if (!leadIsTrump) {
                this.suitPlayedCount[cards[0].suit] += cards.length;
            }
        } else {
            let leadIsTrump = this.played[this.firstPlayerOfRound][0].isTrump;
            let leadSuit = leadIsTrump ? 4 : this.played[this.firstPlayerOfRound][0].suit;
            let followCorrect = cards.every(c => leadIsTrump ? c.isTrump : (!c.isTrump && c.suit === leadSuit));
            if (!followCorrect && cards.length > 0) this.voidMap[pidx][leadSuit] = true;
        }

        cards.forEach(c => {
            if (c.isTrump) this.trumpPlayedCount++;
            if (!c.isTrump && c.rankIdx === 12) {
                this.playedAces[c.suit] = (this.playedAces[c.suit] || 0) + 1;
            }
        });
        // 这些牌从此已经公开，AI后续只能从这个公开历史进行算牌。
        this.phase5RememberPlay(pidx,cards);
        this.playHistory.push(...cards);

        this.played[pidx] = cards;
        this.hands[pidx] = this.hands[pidx].filter(c => !cards.includes(c));
        this.renderAiLog();
        
        if (pidx === 0) this.renderHand(false);
        this.renderTable();

        if (this.played.every(p => p.length > 0)) {
            if (this.hands[0].length === 0) {
                this.lastTrickLeadCards = [...this.played[this.firstPlayerOfRound]];
            }
            this.turn=-1;
            if(cards.length>1) {this.phase='TRICK_REVIEW';this.renderTrickReadback();this.updateUI();}
            else {this.updateUI();const epoch=this.dealEpoch,lead=this.played[this.firstPlayerOfRound];
                this.trickTimer=setTimeout(()=>{if(epoch===this.dealEpoch&&this.phase==='PLAYING'&&this.played[this.firstPlayerOfRound]===lead)this.resolveTrick();},1500);}

        } else {
            this.turn = (pidx + 1) % 4;
            this.updateUI(); 
            if (this.turn !== 0) this.aiTurn();
        }
    }

    getWinner() {
        const leadIdx=this.firstPlayerOfRound, lead=this.played[leadIdx]||[];
        if(!lead.length) return -1;
        const leadTrump=lead[0].isTrump, suit=lead[0].suit;
        let winner=leadIdx, max=this.phase4ContestWeight(lead,lead);
        for(let offset=1;offset<4;offset++) {
            const seat=(leadIdx+offset)%4, cards=this.played[seat];
            if(!cards || cards.length!==lead.length) continue;
            const trump=cards.every(c=>c.isTrump);
            if(leadTrump?!trump:(!trump && !cards.every(c=>!c.isTrump&&c.suit===suit))) continue;
            if(!this.phase4MatchesStructure(cards,lead)) continue;
            let value=this.phase4ContestWeight(cards,lead)+(trump&&!leadTrump?100000:0);
            if(value>max) {max=value;winner=seat;}
        }
        return winner;
    }

    phase4ContestWeight(cards,lead) {
        const lengths=this.getAllTractors(lead).map(t=>t.length);
        if(lengths.length) {
            const len=Math.max(...lengths);
            // 取能留下其余必要结构的最大拖拉机，不能借不相关的大对子虚增牌力。
            let best=-Infinity;
            for(const core of this.phase4StructureCores(cards,lead,160)) {
                best=Math.max(best,...core.slice(0,len*2).map(c=>c.weight));
            }
            return best;
        }
        return this.calcBatchWeight(cards,this.getPairs(lead).length);
    }

    calcBatchWeight(cards, reqPairs) {
        if (reqPairs > 0) {
            let pairs = this.getPairs(cards);
            if (pairs.length === 0) return 0;
            return Math.max(...pairs.map(p => p[0].weight));
        }
        return Math.max(...cards.map(c => c.weight));
    }

    renderTrickReadback() {
        const panel=document.getElementById('trick-readback');panel.replaceChildren();panel.hidden=false;
        for(let offset=0;offset<4;offset++) {
            const seat=(this.firstPlayerOfRound+offset)%4,row=document.createElement('p');
            row.textContent=`${NAMES[seat]}${seat===this.getWinner()?'（本墩最大）':''}：${this.played[seat].map(c=>c.getLabel()).join('　')}`;panel.appendChild(row);
        }
    }

    continueTrick() {
        if(this.phase!=='TRICK_REVIEW')return;
        this.phase='PLAYING';document.getElementById('trick-readback').hidden=true;
        document.getElementById('btn-play').innerText='出 牌';this.resolveTrick();
    }

    resolveTrick() {
        if(this.phase!=='PLAYING'||!this.played.every(p=>p.length))return;
        clearTimeout(this.trickTimer);this.trickTimer=null;
        let winner = this.getWinner();
        let pts = 0;
        this.played.forEach(p => p.forEach(c => pts += c.score));
        let isPlayerTeamWin = (winner === 0 || winner === 2);
        
        if (pts > 0) {
            if (this.dealer % 2 === winner % 2) {
                this.dealerScore += pts;
                if (isPlayerTeamWin) { speakText("帅爆了！"); this.showFX("🌸 帅爆了! 🌸"); sfx.score(); }
                else { speakText("KO!"); this.showFX("💥 压死你 💥"); sfx.ko(); }
            } else {
                this.score += pts;
                if (isPlayerTeamWin) { speakText("帅爆了！"); this.showFX("🌸 帅爆了! 🌸"); sfx.score(); }
                else { speakText("KO!"); this.showFX("💥 压死你 💥"); sfx.ko(); }
            }
        } else {
            if (isPlayerTeamWin) this.showFX("赢！"); else this.showFX("对手赢");
        }

        this.recorder.safe(()=>this.recorder.trick(winner,pts));

        // Phase 3：先把“已确认无对子/无同长度拖拉机”等不可逆事实写入永久推理状态。
        this.phase3CommitInferenceFromCompletedTrick();

        // Phase 2：牌墩历史只记录已经公开发生的事实，用于“读对家”和节奏判断。
        if (this.firstPlayerOfRound !== -1 && this.played[this.firstPlayerOfRound].length > 0) {
            let leadCardsSnapshot = this.played[this.firstPlayerOfRound];
            this.trickHistory.push({
                leader: this.firstPlayerOfRound,
                winner,
                points: pts,
                leadTrump: leadCardsSnapshot[0].isTrump,
                leadSuit: leadCardsSnapshot[0].isTrump ? 4 : leadCardsSnapshot[0].suit,
                leadPairCount: this.getPairs(leadCardsSnapshot).length,
                leadWasTractor: this.isPureTractor(leadCardsSnapshot),
                plays: this.played.map(p=>p.map(c=>({suit:c.suit, rankIdx:c.rankIdx, isTrump:c.isTrump, weight:c.weight, score:c.score, tractorId:c.tractorId})))
            });
            if (this.trickHistory.length > 24) this.trickHistory.shift();
        }

        this.played = [[],[],[],[]];
        this.renderTable();
        
        this.turn = winner; 
        this.firstPlayerOfRound = -1; 
        this.updateUI();

        if (this.hands[0].length === 0) setTimeout(() => this.endRound(winner), 1200);
        else if (this.turn !== 0) this.aiTurn();
    }

    endRound(lastWin) {
        let msg = `本局结束！\n\n`;
        let isChallengerWinLast = (lastWin % 2 !== this.dealer % 2);
        let bottomPts = 0;
        this.bottomCards.forEach(c => bottomPts += c.score);
        
        if (isChallengerWinLast) {
            let leadCards = this.lastTrickLeadCards || [];
            // 抠底倍率：单张2倍，对子4倍，拖拉机按长度指数增长
            let mult = 2;
            if (leadCards.length >= 2) {
                let lPairs = this.getPairs(leadCards);
                if (lPairs.length >= 2 && this.isTractor(lPairs)) {
                    // 拖拉机：每个连对翻4倍（2连对=16，3连对=64）
                    mult = Math.pow(4, lPairs.length);
                } else if (lPairs.length >= 1) {
                    mult = 4; // 对子
                } else {
                    mult = 2; // 多单张甩牌
                }
            }
            let addedPts = bottomPts * mult;
            this.score += addedPts;
            msg += `🔥 闲家最后一轮绝杀，底牌被扣！\n`;
            msg += `底牌分: ${bottomPts} | 牌型倍率: x${mult} | 闲家加分: +${addedPts}分\n`;
        } else {
            msg += `🛡️ 庄家保底成功！底牌 ${bottomPts} 分不计入闲家。\n`;
        }
        msg += `(摊开底牌: [${this.bottomCards.map(c=>c.getLabel()).join(' ')}])\n\n`;
        msg += `闲家最终抓分: ${this.score}\n\n`;

        this.recorder.safe(()=>this.recorder.finish(lastWin));

        let dTeam = this.dealer % 2;
        let cTeam = 1 - dTeam;
        let isPlayerTeamWinGame = false;

        if (this.score < 80) {
            let jump = 1;
            if (this.score === 0) { jump = 3; msg += "🛡️ 闲家大光 (0分)，庄家连跳两级 (+3)！\n"; }
            else if (this.score < 40) { jump = 2; msg += "🛡️ 闲家小光 (<40分)，庄家跳一级 (+2)！\n"; }
            else { msg += "🛡️ 庄家成功保级 (+1)！\n"; }
            
            this.teamRanks[dTeam] += jump;
            if (this.teamRanks[dTeam] > 12) {
                this.teamRanks[dTeam] = this.teamRanks[dTeam] % 13;
                msg += "\n🌟 庄家成功打过A，涅槃重生回到打 2！\n";
            }
            this.dealer = (this.dealer + 2) % 4; 
            isPlayerTeamWinGame = (this.dealer % 2 === 0);
        } else {
            this.dealer = (this.dealer + 1) % 4; 
            isPlayerTeamWinGame = (this.dealer % 2 === 0);
            
            let jump = 0;
            // 【修复4】升级门槛按“120分起，每满40分升一级”。原来写的 180 会多跳一级。
            if (this.score >= 200) jump = 3;
            else if (this.score >= 160) jump = 2;
            else if (this.score >= 120) jump = 1;
            
            if (jump === 3) msg += "🏆 闲家极限界限，抢回坐庄并连跳三级 (+3)！\n";
            else if (jump === 2) msg += "🏆 闲家大胜，抢回坐庄并跳两级 (+2)！\n";
            else if (jump === 1) msg += "🏆 闲家胜利，抢回坐庄并跳一级 (+1)！\n";
            else msg += "🏆 闲家仅抢回坐庄权 (80-115分未跳级)！\n";
            
            this.teamRanks[cTeam] += jump;
            if (this.teamRanks[cTeam] > 12) {
                this.teamRanks[cTeam] = this.teamRanks[cTeam] % 13;
                msg += "\n🌟 新庄家已成功打过A，涅槃重生回到打 2！\n";
            }
        }

        if (isPlayerTeamWinGame) {
            sfx.gameWin(); speakText("恭喜，我们赢了！太棒了！"); spawnParticles("🌸"); spawnParticles("✨");
        } else {
            sfx.gameLose(); speakText("哎呀，太遗憾了。"); spawnParticles("🌧️"); spawnParticles("💔");
        }

        setTimeout(() => {
            alert(msg);
            this.phase = 'READY'; this.gameCount++;
            this.currentRank = this.teamRanks[this.dealer % 2]; 
            document.getElementById('btn-play').innerText = "下局发牌";
            document.getElementById('btn-play').disabled = false;
            this.updateUI();
        }, 3000); 
    }

    renderHand(isSortAnim) {
        const c = document.getElementById('hand-container');
        const viewport=document.getElementById('hand-viewport'), scroll=viewport.scrollLeft;
        const selected=new Set(this.getSelected().map(c=>c.id));
        c.innerHTML = '';
        let lastSuit = -1;
        let lastIsTrump = false;

        this.hands[0].forEach((card, i) => {
            let div = document.createElement('div');
            div.className = `card ${card.suit%2===1?'red':''} ${card.isTrump?'is-trump':''}`;
            
            let extraMargin = 0;
            if (i > 0) {
                if (card.isTrump !== lastIsTrump || (!card.isTrump && card.suit !== lastSuit)) {
                    extraMargin = 15; 
                }
            }
            lastIsTrump = card.isTrump;
            lastSuit = card.suit;

            div.style.marginLeft = i === 0 ? '0' : `-${48 - extraMargin}px`;
            if(extraMargin)div.classList.add('suit-start');
            if(selected.has(card.id))div.classList.add('selected');
            div.dataset.cardId=String(card.id);div.setAttribute('role','button');div.tabIndex=0;
            div.setAttribute('aria-label',card.getLabel()+(card.isTrump?'，主牌':''));div.setAttribute('aria-pressed',String(selected.has(card.id))); 
            
            if (isSortAnim) {
                div.style.transform = `translateY(-50px) rotate(${Math.random()*10-5}deg)`;
                setTimeout(() => div.style.transform = '', i * 20);
            }
            div.innerHTML = `<span style="font-size:16px;font-weight:bold;">${card.getLabel().slice(0,1)}</span><span style="font-size:22px;margin-top:4px;">${card.getLabel().slice(1)}</span>`;
            div.onclick=()=>{
                if(Date.now()<(this.handDragUntil||0))return;
                if((this.phase==='PLAYING'&&this.turn===0)||this.phase==='BURYING'||this.phase==='DEALING') {
                    div.classList.toggle('selected');div.setAttribute('aria-pressed',String(div.classList.contains('selected')));this.updateHandHint();
                }
            };
            div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();div.onclick();}};
            div.cardData = card;
            c.appendChild(div);
        });
        viewport.scrollLeft=scroll;this.updateHandHint();
    }

    updateHandHint() {
        const box=document.getElementById('hand-hint');if(!box)return;
        const count=this.getSelected().length,total=this.hands[0].length;
        box.textContent=this.phase==='BURYING'&&this.dealer===0?`庄家埋底：已选 ${count} / 8 张 · 手牌 ${total} 张 · 左右滑动查看`:`手牌 ${total} 张 · 已选 ${count} 张 · 左右滑动查看`;
    }

    setupHandScrolling() {
        const viewport=document.getElementById('hand-viewport');let down=null;
        viewport.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};},{passive:true});
        viewport.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)this.handDragUntil=Date.now()+350;},{passive:true});
        viewport.addEventListener('pointerup',()=>{down=null;},{passive:true});
        viewport.addEventListener('pointercancel',()=>{down=null;this.handDragUntil=Date.now()+350;},{passive:true});
    }

    renderTable() {
        for(let i=0; i<4; i++){
            let s = document.getElementById(`slot-${i}`);
            s.innerHTML = '';s.dataset.seat=NAMES[i];
            if (this.phase === 'PLAYING' && this.turn === i && this.played[i].length === 0) s.classList.add('active');
            else s.classList.remove('active');

            this.played[i].forEach(card => {
                let div = document.createElement('div');
                div.className = `card ${card.suit%2===1?'red':''}`;
                div.style.width = '50px'; div.style.height = '75px';
                div.innerHTML = `<span style="font-size:12px;">${card.getLabel().slice(0,1)}</span><span style="font-size:16px;">${card.getLabel().slice(1)}</span>`;
                s.appendChild(div);
            });
        }
    }

    updateUI() {
        document.getElementById('my-rank-ui').innerText = RANKS[this.teamRanks[0]];
        document.getElementById('enemy-rank-ui').innerText = RANKS[this.teamRanks[1]];
        
        if (this.dealer !== -1) {
            document.getElementById('my-rank-ui').style.color = (this.dealer % 2 === 0) ? '#f39c12' : '#555';
            document.getElementById('enemy-rank-ui').style.color = (this.dealer % 2 === 1) ? '#f39c12' : '#555';
        }

        document.getElementById('trump-ui').innerText = this.trumpSuit === -1 ? '等待' : (this.trumpSuit === 4 ? '无花色主(王+级牌)' : SUITS[this.trumpSuit]);
        document.getElementById('score-ui').innerText = this.score;
        document.getElementById('dealer-score-ui').innerText = this.dealerScore;
        
        document.getElementById('dealer-ui').innerText = this.dealer === -1 ? "未定" : NAMES[this.dealer];
        document.getElementById('camp-ui').innerText = this.dealer === -1 ? "-" : ((this.dealer % 2 === 0) ? "【你方庄】" : "【对方庄】");
        
        document.body.dataset.phase=this.phase;
        this.updateHandHint();
        if(this.phase==='TRICK_REVIEW') {
            document.getElementById('turn-ui').innerText='等待你看完本墩';
            document.getElementById('btn-play').innerText='看完了，继续';document.getElementById('btn-play').disabled=false;
        } else if(this.phase==='REVEALING') {
            document.getElementById('turn-ui').innerText='公开翻底牌定主';document.getElementById('btn-play').disabled=true;
        } else if(this.phase==='DEALING') {
            document.getElementById('turn-ui').innerText=this.dealingFinished?'等待结束抢主':'发牌抢主中';
            document.getElementById('btn-play').innerText=this.dealingFinished?'结束抢主':'发牌中';document.getElementById('btn-play').disabled=!this.dealingFinished;
        } else if (this.phase === 'PLAYING') {
            document.getElementById('turn-ui').innerText = this.turn === -1 ? "结算中..." : NAMES[this.turn];
            document.getElementById('btn-play').disabled = (this.turn !== 0);
            this.renderTable(); 
        } else {
            document.getElementById('turn-ui').innerText = "准备中";
        }
    }

    getSelected() { return Array.from(document.querySelectorAll('#hand-container .card.selected')).map(el => el.cardData); }
    showFX(txt) {
        const el = document.getElementById('fx-layer');
        el.innerText = txt;
        if (txt.includes("错牌") || txt.includes("失败") || txt.includes("对子")) el.className = "fx-text fx-ko";
        else if (txt.includes("KO") || txt.includes("作弊")) el.className = "fx-text fx-ko"; 
        else el.className = "fx-text";
        el.style.animation = 'none'; el.offsetHeight; el.style.animation = 'popOut 2.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    }
}

let game;
window.onload = () => { game = new TractorEngine(); game.setupHandScrolling(); game.updateUI(); game.recorder.renderStatus(); };
window.addEventListener('pagehide',()=>{if(game) game.recorder.safe(()=>game.recorder.persist());});
document.addEventListener('visibilitychange',()=>{if(document.hidden && game) game.recorder.safe(()=>game.recorder.persist());});
</script>
</body>
